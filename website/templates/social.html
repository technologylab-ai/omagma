<!doctype html>
<!--
  Omagma social card: 1200×630, static HTML/CSS, no script, no network.
  Render with headless Chromium at a 1200×630 viewport, device scale 1.
  The public-media renderer fills {{base}} and serves the approved assets.
  Master: docs/images/omagma-social-calendar.png; older names are aliases.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, height=630">
  <title>Omagma — Gmail and Calendar in your terminal</title>
  <style>
    :root {
      --ink-0: #0a0d14;
      --ink-1: #0e121b;
      --ink-2: #141926;
      --line: #242b3d;
      --line-strong: #343c54;
      --text-0: #f4f0f7;
      --text-1: #dcd7e4;
      --text-2: #b6b0c4;
      --text-3: #8f8aa1;
      --magma: #ec7a35;
      --magma-hi: #f6a467;
      --magma-deep: #b4461b;
      --cyan: #7ccfe2;
      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Noto Sans", Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "JetBrains Mono", "JetBrainsMono Nerd Font",
        "SF Mono", SFMono-Regular, "Cascadia Code", Menlo, Consolas,
        "DejaVu Sans Mono", "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--ink-1);
    }

    body {
      color: var(--text-1);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      display: grid;
      grid-template-columns: 384px 688px;
      column-gap: 36px;
      width: 1200px;
      height: 630px;
      padding: 52px 40px 46px 52px;
      background:
        radial-gradient(520px 340px at 0% 0%, rgb(236 122 53 / 0.13), transparent 70%),
        radial-gradient(560px 380px at 100% 100%, rgb(124 207 226 / 0.09), transparent 70%),
        var(--ink-1);
    }

    /* Static magma seam, as on the website hero */
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--magma-deep), var(--magma) 28%,
        var(--magma-hi) 50%, var(--magma) 72%, var(--magma-deep));
    }

    .copy {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text-0);
      font: 600 30px/1 var(--font-mono);
      letter-spacing: -0.01em;
    }

    .brand img {
      width: 52px;
      height: 52px;
    }

    h1 {
      margin-top: 40px;
      color: var(--text-0);
      font-size: 60px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.042em;
    }

    h1 em {
      color: var(--magma-hi);
      font-style: normal;
    }

    .platforms {
      margin-top: 24px;
      color: var(--text-1);
      font-size: 25px;
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .platforms strong {
      color: var(--text-0);
      font-weight: 650;
    }

    /* Wraps as a whole line rather than squeezing the label beside the tag. */
    .foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      margin-top: auto;
      color: var(--text-3);
      font: 400 16px/1.3 var(--font-mono);
      letter-spacing: 0.02em;
    }

    .tag {
      padding: 4px 9px;
      border: 1px dashed rgb(196 179 239 / 0.55);
      border-radius: 4px;
      color: #c4b3ef;
      font: 500 13px/1 var(--font-mono);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .shot {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    /* Hugs the capture: full 688px when width-bound, narrower when height-bound. */
    .frame {
      width: fit-content;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--ink-0);
      box-shadow:
        0 30px 60px -30px rgb(0 0 0 / 0.8),
        0 0 0 1px rgb(0 0 0 / 0.25);
    }

    .bar {
      display: flex;
      justify-content: space-between;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--ink-2);
      color: var(--text-2);
      font: 500 14px/1.2 var(--font-mono);
    }

    .bar span:first-child { color: var(--text-3); }
    .bar span:first-child::before { content: "$ "; color: var(--magma); }

    /* Natural aspect ratio, never stretched, cropped or letterboxed. 456px keeps
       bar + capture + caption inside the 532px content box. */
    .capture { padding: 8px 10px 10px; background: #111620; }

    .frame img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 456px;
    }

    .shot figcaption {
      margin-top: 14px;
      color: var(--text-3);
      font: 400 15px/1.3 var(--font-mono);
      letter-spacing: 0.01em;
    }

    .shot figcaption b {
      color: var(--cyan);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="copy">
      <p class="brand"><img src="{{base}}assets/omagma-logo.png" alt="">omagma</p>
      <h1>Gmail and<br>Calendar<br><em>in your<br>terminal.</em></h1>
      <p class="platforms"><strong>Native TUI</strong><br>for Linux and macOS</p>
      <p class="foot"><span class="tag">Experimental</span><span>Mail · Calendar · Agent CLI</span></p>
    </div>

    <figure class="shot">
      <div class="frame">
        <p class="bar"><span>omagma tui</span><span>Calendar › Week</span></p>
        <div class="capture"><img src="{{base}}assets/omagma-calendar-week.png"
             alt="Omagma Calendar Week combining three accounts"></div>
      </div>
      <figcaption><b>Combined Week</b> · three Google accounts · real app, fictional data</figcaption>
    </figure>
  </main>
</body>
</html>
