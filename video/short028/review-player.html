<!doctype html><html><head><meta charset="utf-8"><title>Owned video playback review</title><style>html,body{margin:0;background:#000;width:1280px;height:720px;overflow:hidden}video{width:1280px;height:720px;display:block}</style></head><body><video id="movie" muted playsinline preload="auto"></video><script>
window.READY=new Promise((resolve,reject)=>{const v=document.getElementById('movie'),name=new URLSearchParams(location.search).get('movie')||'final-review.mp4';if(!/^[a-z0-9][a-z0-9.-]*\.mp4$/.test(name)||name.includes('..'))return reject(Error('invalid movie filename'));v.onloadeddata=()=>resolve({duration:v.duration});v.onerror=()=>reject(Error('Encoded movie failed to load'));v.src='/video/cache/short028/'+name;});
</script></body></html>
