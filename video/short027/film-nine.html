<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Omagma v0.2.7 — nine-feature release film</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080605;overflow:hidden}
#screen{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
iframe{display:block;width:1920px;height:1080px;border:0}
#upgrade{position:absolute;inset:0;display:none;color:#f7ede5;font-family:"Adwaita Sans","Noto Color Emoji",sans-serif;background:radial-gradient(110% 90% at 50% 105%,#2c1409,#100a07 65%,#080605);overflow:hidden}
#upgrade .caption{position:absolute;left:120px;top:38px}
#upgrade .number{font:700 24px "JetBrainsMono Nerd Font",monospace;color:#ff9e61;letter-spacing:.08em}
#upgrade h1{font-size:56px;line-height:1.15;margin:4px 0 8px;font-weight:800}
#upgrade .subtitle{font-size:28px;color:#eccdb8;margin:0}
#upgrade .bug{position:absolute;right:120px;top:46px;font:700 20px "JetBrainsMono Nerd Font",monospace;color:#d8b49c}
#upgrade .native{position:absolute;border-radius:16px;background:#111620;overflow:hidden;box-shadow:0 25px 90px #0009,0 0 0 2px #ff9e6170,0 0 90px #ec7a3530}
#upgrade img{display:block;max-width:none}
#upgrade-card{left:403px;top:390px;width:1113px;height:290px}
#upgrade-card img{width:1113px;height:auto}
#upgrade-guide{left:403px;top:200px;width:1113px;height:823px}
#upgrade-guide img{width:1113px;height:823px;object-fit:contain}
#upgrade .disclosure{position:absolute;left:120px;bottom:8px;font-size:22px;color:#c8beb5}
#upgrade .guide-only{position:absolute;right:120px;bottom:8px;font-size:22px;color:#c8beb5}
</style>
</head>
<body><div id="screen"><iframe id="picture" src="film.html" title="Omagma feature scenes"></iframe></div><div id="upgrade">
 <div class="caption"><div class="number">09/09</div><h1>Update on your terms</h1><p class="subtitle">A quiet notice. The exact steps when you're ready.</p></div>
 <div class="bug">Omagma v0.2.7</div>
 <div id="upgrade-card" class="native"><img id="update-card-image" src="/video/cache/short027/assets/updates-card-detail.png" alt=""></div>
 <div id="upgrade-guide" class="native"><img src="/video/cache/short027/assets/updates-guide-detail.png" alt=""><div style="position:absolute;left:22px;top:315px;width:1068px;height:169px;border:2px solid #ff9e61;border-radius:8px;box-shadow:0 0 24px #ec7a3540;pointer-events:none"></div></div>
 <div class="disclosure">Illustrative update demo · 0.2.8 fixture</div>
 <div class="guide-only">Guide only · nothing installs automatically</div>
</div><script>
(() => {
  'use strict';
  const frame = document.getElementById('picture');
  const loaded = new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
  let plan,music,child,sourceRender,sourceQa,cues;
  const upgrade=document.getElementById('upgrade'),card=document.getElementById('upgrade-card'),guide=document.getElementById('upgrade-guide'),cardImg=document.getElementById('update-card-image');
  const clamp = v => Math.max(0, Math.min(1, v));
  const smooth = v => v * v * (3 - 2 * v);
  function at(t) {
    const seconds = Math.max(0, Math.min(plan.duration, Number(t) || 0));
    const number = Math.min(plan.frameCount - 1, seconds * plan.fps);
    const part = plan.parts.find(p => number < p.frameOut) || plan.parts.at(-1);
    const progress = clamp((number - part.frameIn) / (part.frameOut - part.frameIn));
    return {t:seconds, part, sourceTime:part.overlay?92.3:part.sourceIn+progress*(part.sourceOut-part.sourceIn),
      elapsed:seconds - part.frameIn / plan.fps};
  }
  function bodyAlpha(state) {
    // Old content must not continue behind the following chapter introduction.
    // On the next state, fade the actual screenshot back in with its modal.
    if (state.part.titleLead) return 1 - smooth(clamp(state.elapsed / .12));
    const index = plan.parts.indexOf(state.part);
    return index > 0 && plan.parts[index - 1].titleLead ? smooth(clamp(state.elapsed / .14)) : 1;
  }
  function pulse(t, cue, tail) {
    const distance = t - cue;
    return distance < 0 || distance >= tail ? 0 : 1 - smooth(distance / tail);
  }
  window.render = t => {
    if (!child) return false;
    const state = at(t);
    sourceRender(state.sourceTime);
    child.document.getElementById('iCnt').textContent='9 highlights';
    for(const el of child.document.querySelectorAll('.cap .n'))el.textContent=el.textContent.replace('/08','/09');
    const showing=!!state.part.overlay;
    frame.style.opacity=showing?'0':'1';upgrade.style.display=showing?'block':'none';
    if(showing){
      const local=state.t-52.8;
      upgrade.querySelector('.caption').style.opacity=Math.min(1,local/.28);
      card.style.display=local>=1&&local<3.8?'block':'none';
      const imagePath='/video/cache/short027/assets/'+(local>=3.2?'updates-card-focused-detail.png':'updates-card-detail.png');if(cardImg.getAttribute('src')!==imagePath)cardImg.setAttribute('src',imagePath);
      guide.style.display=local>=3.8?'block':'none';
      guide.style.opacity=local<3.8?'0':String(Math.min(1,(local-3.8)/.28));
      upgrade.querySelector('.guide-only').style.opacity=local>=3.8?'1':'0';
    }
    const extra=child.document.getElementById('intro-nine-segment');
    if(extra)extra.style.opacity=String(Math.max(0,Math.min(1,(state.sourceTime-1.2)/.35)));
    const ninth=child.document.getElementById('bug-nine-fill');
    if(ninth)ninth.style.transform='scaleX('+(state.t>=52.8?1:0)+')';
    child.document.getElementById('shots').style.opacity = bodyAlpha(state);
    // Picture and audio have separate clocks. Decorative accents follow the
    // original-tempo soundtrack instead of the compressed source picture.
    let accent = 0;
    for (const cue of cues) accent = Math.max(accent, pulse(state.t, cue.film, .55));
    const glow = child.document.getElementById('glow');
    glow.style.opacity = .44 + .16 * accent;
    glow.style.transform = 'scale(' + (1 + .08 * accent) + ')';
    child.document.getElementById('flash').style.opacity = .10 * Math.max(
      pulse(state.t, music.mappedMusicLandmarks.find(x=>x.name==='drop').film, .45),
      pulse(state.t, music.mappedMusicLandmarks.find(x=>x.name==='stop').film, .45));
    return true;
  };
  window.qa = t => {
    const state = at(t), base = sourceQa(state.sourceTime);
    return {...base,scene:state.part.overlay?'09/09':base.scene.replace('/08','/09'),captions:state.part.overlay?['09/09 Update on your terms','A quiet notice. The exact steps when you are ready.','Illustrative0.2.8 fixture; guide only']:base.captions.map(x=>x.replace('/08','/09').replace('8 highlights','9 highlights')), t:state.t, frame:Math.min(plan.frameCount-1,Math.round(state.t*plan.fps)),
      phase:state.part.name, sourceTime:state.sourceTime, bodyOpacity:bodyAlpha(state),
      visibleAssets:state.part.overlay?(state.part.titleLead?[]:[state.part.name.includes('guide')?'updates-guide-detail.png':(state.part.name==='How to update'?'updates-card-focused-detail.png':'updates-card-detail.png')]):(bodyAlpha(state)<.01?[]:base.visibleAssets)};
  };
  window.READY = Promise.all([
    fetch('nine.json').then(r=>{if(!r.ok)throw Error('Missing brisk timeline');return r.json();}),
    fetch('soundtrack-nine.json').then(r=>{if(!r.ok)throw Error('Missing brisk soundtrack');return r.json();}),
    loaded
  ]).then(async ([p,m]) => {
    plan=p;music=m;child=frame.contentWindow;
    const ready=await child.READY;
    await document.fonts.ready;
    await new Promise((r,j)=>{const i=new Image();i.onload=r;i.onerror=j;i.src='/video/cache/short027/assets/updates-card-focused-detail.png';});
    await Promise.all(Array.from(upgrade.querySelectorAll('img')).map(i=>i.complete&&i.naturalWidth?Promise.resolve():new Promise((r,j)=>{i.onload=r;i.onerror=j;})));
    const introSeg=child.document.createElement('i');introSeg.id='intro-nine-segment';child.document.getElementById('iSegs').append(introSeg);
    const seg=child.document.createElement('i'),fill=child.document.createElement('b');fill.id='bug-nine-fill';seg.append(fill);child.document.getElementById('segs').append(seg);
    if(plan.frameCount!==music.frameCount||plan.fps!==music.fps)throw Error('Picture/music timing mismatch');
    sourceRender=child.render;sourceQa=child.qa;
    cues=music.mappedMusicLandmarks.filter(x=>x.name!=='opening'&&x.name!=='naturalEnd');
    window.FILM={width:1920,height:1080,fps:plan.fps,frameCount:plan.frameCount,duration:plan.duration,parts:plan.parts};
    window.FILM_MUSIC=music;
    window.render(0);
    return {ok:true,...window.FILM,warnings:ready.warnings||[]};
  });
  const fit=()=>{const k=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('screen').style.transform='scale('+k+')';upgrade.style.width='1920px';upgrade.style.height='1080px';upgrade.style.transformOrigin='0 0';upgrade.style.transform='scale('+k+')';};
  addEventListener('resize',fit);fit();
})();
</script></body></html>
