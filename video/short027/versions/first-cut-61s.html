<body>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id), ST = $('S');
const A = '/video/cache/short027/assets/', LOGOS = [A + 'logo.png', '/assets/omagma-logo.png'];
const DUR = 1858 / 30;
window.FILM = { width: 1920, height: 1080, fps: 30, frameCount: 1858, duration: DUR };
const M = window.FILM_MUSIC = { intro: 0, bass: 4.6, step: 8.924, drums: 26.524, roll: 35.302, drop: 39.575, next: 48.12, last: 56.665, stop: 59.093, end: 61.933 };
// Editorial highlight of the real "Open TUI" button as [x,y,w,h] in bar.png pixels. null = no box, centre push only.
const CAL = { barBtn: [966,12,138,48] };
const CHB = [2.5, 8.5, 13.2, 18.0, 23.0, 30.0, 36.0, 44.2, 49.0];
const DIM = {
  'bar.png': [1480, 880], 'palette-detail.png': [1584, 396], 'help-detail.png': [1980, 1760], 'saved-search-detail.png': [1584, 352],
  'labels-detail.png': [1584, 1056], 'label-colors-detail.png': [1584, 836], 'meeting-details-detail.png': [2200, 1320],
  'meeting-review-detail.png': [2200, 1320], 'join-detail.png': [2200, 1320], 'recipient-detail.png': [2112, 264],
  'recipient-named-detail.png': [2112, 264], 'files-detail.png': [2024, 880], 'format-choice-detail.png': [1540, 528],
  'countdown-detail.png': [3520, 132], 'countdown-nine-detail.png': [3520, 132], 'send-canceled-detail.png': [3520, 132],
};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, p) => a + (b - a) * p;
const pr = (t, a, b) => (b <= a ? +(t >= a) : clamp((t - a) / (b - a)));
const sm = p => p * p * (3 - 2 * p), eo = p => 1 - (1 - p) ** 3, ei = p => p * p * p;
const E = (t, a, b, f = sm) => f(pr(t, a, b));
const win = (t, a, b, fi = 0.3, fo = 0.3) => (t < a || t >= b ? 0 : E(t, a, a + fi, eo) * (1 - E(t, b - fo, b, ei)));
const pulse = (t, c, up, dn) => (t < c - up || t > c + dn ? 0 : t < c ? sm(pr(t, c - up, c)) : 1 - sm(pr(t, c, c + dn)));
const fx = (v, d = 3) => (+v).toFixed(d), pad = n => String(n).padStart(2, '0');
const setL = (el, op, tf) => { el.style.opacity = fx(op, 4); if (tf != null) el.style.transform = tf; };
const fadeUp = (el, p, dy) => setL(el, p, `translateY(${fx((1 - p) * dy, 2)}px)`);
function kf(K, t) {
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 1; i < K.length; i++) if (t < K[i][0]) {
    const p = sm(pr(t, K[i - 1][0], K[i][0]));
    return K[i].slice(1).map((v, j) => lerp(K[i - 1][j + 1], v, p));
  }
  return K[K.length - 1].slice(1);
}

/* ============ SHOTS: real PNGs, crop/camera only. k = [t, cx, cy, zoom] in source px ============ */
const MAIN = [120, 210, 1680, 820];
const F = (src, a, b, o = {}) => ({ src, a, b, W: 3520, H: 1848, r: MAIN, ref: 1680, k: [[a, 1760, 924, 1], [b, 1760, 924, 1.06]], ...o });
const D = (src, a, b, o = {}) => {
  const [W, H] = DIM[src], s = Math.min((o.mw || 1440) / W, (o.mh || 660) / H, 1.1), w = W * s, h = H * s, cy = o.cy || 625;
  return { src, a, b, W, H, det: 1, r: [960 - w / 2, cy - h / 2, w, h], ref: w, k: [[a, W / 2, H / 2, 1]], ...o };
};
const bc = CAL.barBtn ? [CAL.barBtn[0] + CAL.barBtn[2] / 2, CAL.barBtn[1] + CAL.barBtn[3] / 2] : [740, 440];
const SH = [
  D('bar.png', 2.25, 4.72, { mw: 1500, mh: 800, cy: 620, fo: 0.1, k: [[2.25, 740, 440, 1], [3.2, 740, 440, 1], [4.6, ...bc, 1.15]] }),
  F('main.png', 4.6, 8.98, { fi: 0.06, k: [[4.6, 1760, 924, 1.14], [5.5, 1760, 924, 1], [8.98, 1760, 860, 1.07]] }),
  F('palette.png', 8.924, 11.0, { fi: 0.06 }), D('palette-detail.png', 9.3, 10.95),
  F('help.png', 10.9, 13.3),
  D('help-detail.png', 11.25, 13.15, { r: [310, 210, 1300, 820], ref: 1300, k: [[11.25, 990, 0, 1], [11.8, 990, 0, 1], [13.1, 990, 1760, 1]] }),
  F('find.png', 13.2, 15.0), F('find-next.png', 14.95, 16.45, { fi: 0.06 }),
  F('saved-search.png', 16.35, 18.1), D('saved-search-detail.png', 16.75, 17.95),
  F('labels.png', 18.0, 20.65), D('labels-detail.png', 18.4, 20.55),
  F('label-colors.png', 20.5, 23.1), D('label-colors-detail.png', 20.9, 22.95),
  F('meeting.png', 23.0, 25.15), F('meeting-review.png', 25.0, 28.0), D('meeting-review-detail.png', 25.3, 27.95, { mh: 780 }),
  F('join.png', 27.9, 30.1, { fi: 0.06 }), D('join-detail.png', 28.1, 29.95, { mh: 780, k: [[28.1,1100,660,1],[28.7,1100,660,1],[29.6,800,1320,1.35]] }),
  F('recipient.png', 30.0, 31.65), D('recipient-detail.png', 30.25, 31.55),
  F('recipient-named.png', 31.5, 33.05, { fi: 0.08 }), D('recipient-named-detail.png', 31.6, 32.95, { fi: 0.08 }),
  F('files.png', 32.9, 35.4), D('files-detail.png', 33.15, 35.3),
  F('attached.png', M.roll, 36.1, { fi: 0.06 }),
  F('forward.png', 36.0, 40.95, { rk: [[M.drop, ...MAIN], [40.2, 60, 210, 880, 820]], k: [[36, 1760, 924, 1], [39.5, 1760, 820, 1.08]] }),
  D('format-choice-detail.png', 36.8, 38.75),
  // Native preview: note/table/footers y0..1600, original booking card + CID art y1700..3600. Always full width, never whole page.
  { src: 'browser.png', a: M.drop, b: 44.3, W: 2000, H: 3800, fi: 0.1, fo: 0.25, paper: 1,
    rk: [[40.2, 980, 210, 880, 820], [40.85, 300, 210, 1320, 820]],
    k: [[40.2, 1000, 940, 1], [40.85, 1000, 621, 1], [41.55, 1000, 621, 1], [42.1, 1000, 979, 1], [42.4, 1000, 979, 1],
        [42.95, 1000, 2321, 1], [43.4, 1000, 2321, 1], [44.15, 1000, 2979, 1]] },
  F('send-review-detail.png', 44.2, 45.8, { H: 1672, k: [[44.2, 1760, 836, 1], [45.8, 1760, 836, 1.08]] }),
  F('countdown.png', 45.7, 48.18, { fi: 0.08 }),
  // Exact native status row y44..88, left region; enlarged without changing any pixels.
  D('countdown-detail.png',45.8,48.16,{r:[250,600,1420,48.4],ref:3872,k:[[45.8,0,66,1]],fi:0.06,fo:0.06}),
  F('send-canceled.png',M.next,49.2,{fi:0.05}),
  D('send-canceled-detail.png',M.next,49.1,{r:[500,600,920,48.4],ref:3872,k:[[M.next,0,66,1]],fi:0.06}),
];
const SHOTS = SH.map(sh => {
  const fr = document.createElement('div'), img = new Image();
  fr.className = 'L fr' + (sh.det ? ' det' : '') + (sh.paper ? ' paper' : '');
  img.alt = ''; img.decoding = 'sync'; img.src = A + sh.src;
  fr.appendChild(img); $('shots').appendChild(fr);
  return Object.assign(sh, { fr, img, fi: sh.fi ?? 0.3, fo: sh.fo ?? 0.3, cam: null });
});
const SB = SHOTS[0], SF = SHOTS.find(s => s.src === 'forward.png'), SBR = SHOTS.find(s => s.paper);
let HL = null;
if (CAL.barBtn) { HL = document.createElement('div'); HL.id = 'hl'; HL.className = 'L'; SB.fr.appendChild(HL); }

/* ============ CAPTIONS: {key} = keycap pressed at keys[i], `cmd` = command ============ */
const CAPS = [
  [1, 2.5, 8.45, 'Start from your bar', 'Open TUI runs `omagma tui`', []],
  [2, 8.5, 13.15, 'Every action, one search away', '{Ctrl P} in the mailbox · searchable help', [M.step]],
  [3, 13.2, 17.95, 'Find it. Save the search.', '“calm” 1/5 → 2/5 · saved searches', []],
  [4, 18.0, 22.95, 'Stage label changes, then apply', 'Checked / mixed states · 2 staged changes · label colors', []],
  [5, 23.0, 29.95, 'Meetings, made readable', 'Meeting card · friendly details · {o} joins from the review', [27.9]],
  [6, 30.0, 35.95, 'Name the person. Pick the files.', 'Names stay in recipients · choose multiple files together', []],
  [7, 36.0, 39.45, 'Forward with a personal note', 'Write it in Markdown · the original HTML is preserved', []],
  [7, M.drop, 44.15, 'The original, intact', 'Your note on top · rendered in a real browser', [], 1],
  [8, 44.2, 48.95, 'Send with a safety net', '10 s to change your mind · {Ctrl Z} Undo before sending', [M.next]],
].map(([n, a, b, h, s, keys, hero]) => {
  const el = document.createElement('div');
  el.className = 'L cap' + (hero ? ' hero' : '');
  el.innerHTML = `<div class="n">${pad(n)}/08</div><div class="h">${h.split(' ').map(w => `<span>${w}</span>`).join('')}</div>` +
    `<div class="s">${s.replace(/\{(.+?)\}/g, '<kbd>$1</kbd>').replace(/`(.+?)`/g, '<code>$1</code>')}</div>`;
  $('caps').appendChild(el);
  return { n, a, b, h, keys, el, plain: s.replace(/[{}`]/g, ''), nEl: el.children[0], ws: [...el.children[1].children], sEl: el.children[2], kbs: [...el.querySelectorAll('kbd')] };
});

/* ============ RECAP + chrome ============ */
const REC = [
  ['More everyday wins:', ['Omagma + Omarchy themes', 'Searchable help + saved searches', 'More email addresses + sender choice', 'Unread jumps + half-page scrolling']],
  ['Safer, smoother everywhere:', ['One message or conversation', 'Spam controls + discard drafts', 'Attachment reminders + keyboard controls', 'Keep your place + draft recovery']],
];
const RCARDS = REC.map(([title, rows], i) => {
  const el = document.createElement('div');
  el.className = 'card L'; el.style.left = (120 + i * 860) + 'px'; el.style.top = '300px';
  el.innerHTML = `<div class="t">${title}</div>` + rows.map(r => `<div class="r">${r.replace(/&/g, '&amp;')}</div>`).join('');
  $('recap').appendChild(el);
  return { el, rows: [...el.querySelectorAll('.r')] };
});
const SEGB = CHB.slice(1).map(() => { const i = document.createElement('i'), b = document.createElement('b'); i.appendChild(b); $('segs').appendChild(i); return b; });
const ISEG = CHB.slice(1).map(() => $('iSegs').appendChild(document.createElement('i')));
const ACC = [[M.bass, 0.55, 0.8], [M.step, 0.35, 0.6], [M.drums, 0.5, 0.7], [M.roll, 0.45, 0.7], [M.drop, 1, 1.6], [M.next, 0.4, 0.6], [M.last, 0.3, 0.8], [M.stop, 0.85, 1.4]];

/* ================================ RENDER(t) — absolute, stateless ================================ */
function shots(t) {
  let dim = 0;
  for (const sh of SHOTS) if (sh.det) dim = Math.max(dim, win(t, sh.a, sh.b, sh.fi, sh.fo));
  for (const sh of SHOTS) {
    const op = win(t, sh.a, sh.b, sh.fi, sh.fo), fr = sh.fr;
    if (op < 0.002) { fr.style.opacity = 0; sh.cam = null; continue; }
    const [x, y, w, h] = sh.rk ? kf(sh.rk, t) : sh.r, [cx, cy, z] = kf(sh.k, t);
    const s = z * (sh.ref || w) / sh.W, vw = w / s, vh = h / s;
    const X = vw >= sh.W ? sh.W / 2 : clamp(cx, vw / 2, sh.W - vw / 2), Y = vh >= sh.H ? sh.H / 2 : clamp(cy, vh / 2, sh.H - vh / 2);
    const e = sh.det || sh.paper ? lerp(sh.paper ? 1.06 : 0.955, 1, eo(pr(t, sh.a, sh.a + 0.45))) : 1;
    fr.style.width = fx(w, 1) + 'px'; fr.style.height = fx(h, 1) + 'px';
    fr.style.filter = sh.det || sh.paper ? 'none' : `brightness(${fx(1 - 0.55 * dim)})`;
    setL(fr, op, `translate(${fx(x, 2)}px,${fx(y, 2)}px) scale(${fx(e, 4)})`);
    sh.img.style.transform = `translate(${fx(w / 2 - X * s, 2)}px,${fx(h / 2 - Y * s, 2)}px) scale(${fx(s, 5)})`;
    sh.cam = { x, y, w, h, X, Y, s };
  }
}
function tag(el, sh, t, a, b) {
  const o = win(t, a, b, 0.3, 0.3), c = sh.cam;
  if (o < 0.002 || !c) { setL(el, 0); return; }
  setL(el, o, `translate(${fx(c.x + 22, 1)}px,${fx(c.y + c.h - 66 + (1 - o) * 10, 1)}px)`);
}
function render(tIn) {
  const t = clamp(+tIn || 0, 0, DUR);
  let g = 0;
  for (const [c, k, d] of ACC) g = Math.max(g, k * pulse(t, c, 0.06, d));
  const base = 0.25 + 0.35 * E(t, 0, 2.2) - 0.15 * E(t, 2.4, 3.2) + 0.18 * win(t, M.drop, 44.2, 0.2, 0.6);
  setL($('glow'), clamp(base + 0.6 * g), `scale(${fx(1 + 0.22 * g, 4)})`);

  const io = 1 - E(t, 2.12, 2.5, ei), lp = E(t, 0.15, 1.4, eo);
  $('intro').style.opacity = t < 2.5 ? 1 : 0;
  setL($('iLogo'), lp * io, `translateY(${fx((1 - lp) * 18, 2)}px) scale(${fx(lerp(0.9, 1, lp) * lerp(1, 1.06, 1 - io), 4)})`);
  fadeUp($('iWord'), E(t, 0.55, 1.5, eo) * io, 26);
  fadeUp($('iVer'), E(t, 0.85, 1.7, eo) * io, 18);
  fadeUp($('iCnt'), E(t, 0.75, 1.3, eo) * io, 18);
  ISEG.forEach((s, i) => { s.style.opacity = fx(E(t, 1.45 + i * 0.06, 1.8 + i * 0.06) * io); });

  shots(t);
  if (HL) {
    const c = SB.cam, [bx, by, bw, bh] = CAL.barBtn, o = c ? E(t, 3.2, 3.6) * (1 - E(t, 4.5, 4.6)) : 0;
    setL(HL, o, c ? `translate(${fx((bx - c.X) * c.s + c.w / 2, 1)}px,${fx((by - c.Y) * c.s + c.h / 2, 1)}px)` : null);
    if (c) { HL.style.width = fx(bw * c.s, 1) + 'px'; HL.style.height = fx(bh * c.s, 1) + 'px'; }
  }
  tag($('tagL'), SF, t, 39.75, 40.55);
  tag($('tagR'), SBR, t, 39.8, 41.5);

  for (const c of CAPS) {
    const on = t >= c.a - 0.15 && t < c.b;
    c.el.style.opacity = on ? 1 : 0;
    if (!on) continue;
    const out = E(t, c.b - 0.28, c.b, ei);
    fadeUp(c.nEl, E(t, c.a - 0.15, c.a + 0.25, eo) * (1 - out), 12);
    c.ws.forEach((w, i) => {
      const p = E(t, c.a + i * 0.06, c.a + i * 0.06 + 0.5, eo);
      setL(w, p * (1 - out), `translateY(${fx((1 - p) * 34 - out * 12, 2)}px)`);
    });
    fadeUp(c.sEl, E(t, c.a + 0.3, c.a + 0.75, eo) * (1 - out), 16);
    c.kbs.forEach((k, i) => {
      const d = c.keys[i] == null ? 0 : pulse(t, c.keys[i], 0.06, 0.22);
      k.style.transform = `translateY(${fx(3 * d, 2)}px)`;
      k.style.background = `rgba(255,158,97,${fx(0.12 + 0.5 * d)})`;
      k.style.boxShadow = `0 ${fx(4 - 3 * d, 2)}px 0 rgba(236,122,53,.55),0 0 ${fx(30 * d, 1)}px rgba(255,150,80,${fx(0.8 * d)})`;
    });
  }

  setL($('bug'), E(t, 2.5, 3.0) * (1 - E(t, 48.8, 49.15)));
  SEGB.forEach((b, i) => { b.style.transform = `scaleX(${fx(pr(t, CHB[i], CHB[i + 1]), 4)})`; });

  const ro = 1 - E(t, 58.4, 58.75, ei);
  $('recap').style.opacity = t >= 48.95 && t < 58.75 ? 1 : 0;
  RCARDS.forEach((c, i) => {
    fadeUp(c.el, E(t, 49.0 + i * 0.1, 49.45 + i * 0.1, eo) * ro, 30);
    c.rows.forEach((r, j) => fadeUp(r, E(t, 49.2 + i * 0.08 + j * 0.1, 49.62 + i * 0.08 + j * 0.1, eo), 22));
  });

  const ov = t >= 58.7;
  $('outro').style.opacity = ov ? 1 : 0;
  if (ov) {
    const f = E(t, 58.72, M.stop, ei), sq = pulse(t, M.stop, 0, 0.35), rp = pr(t, M.stop, M.stop + 0.95);
    setL($('oLogo'), pr(t, 58.72, 58.92), `translateY(${fx(lerp(-70, 0, f), 2)}px) scale(${fx(lerp(1.35, 1, f) * (1 - 0.045 * sq), 4)})`);
    setL($('oRing'), t >= M.stop ? 0.85 * (1 - rp) : 0, `scale(${fx(lerp(0.7, 2.1, eo(rp)), 4)})`);
    fadeUp($('oTitle'), E(t, 59.25, 59.75, eo), 26);
    fadeUp($('oPill'), E(t, 59.42, 59.9, eo), 18);
    fadeUp($('oWeb'), E(t, 59.52, 60.0, eo), 18);
    fadeUp($('oFoot'), E(t, 59.75, 60.3, eo), 10);
  }
  setL($('flash'), 0.14 * pulse(t, M.bass, 0.03, 0.3) + 0.5 * pulse(t, M.drop, 0.04, 0.55) + 0.12 * pulse(t, M.stop, 0.03, 0.5));
  return true;
}
window.render = render;

/* ================================ QA ================================ */
let LOGO_SRC = LOGOS[0];
window.qa = tIn => {
  const t = clamp(+tIn || 0, 0, DUR), ci = CHB.findIndex((b, i) => i > 0 && t < b);
  const scene = t < 2.5 ? 'intro' : t < 49 ? `${pad(ci)}/08` : t < 58.7 ? 'recap' : 'outro';
  const visibleAssets = SHOTS.filter(s => win(t, s.a, s.b, s.fi, s.fo) > 0.01).map(s => s.src);
  if (t < 2.5 || t >= 58.7) visibleAssets.push(LOGO_SRC);
  const captions = CAPS.filter(c => t >= c.a && t < c.b).map(c => `${pad(c.n)}/08 ${c.h} — ${c.plain}`);
  if (t < 2.5) captions.push('Omagma', 'v0.2.7', '8 highlights');
  if (t >= 49 && t < 58.75) REC.forEach(([h, r]) => captions.push(h, ...r));
  if (t >= 59.25) captions.push("What's new in v0.2.7", 'Get Omagma', 'technologylab-ai.github.io/omagma', 'Experimental · TUI & CLI · Linux/macOS');
  return { t: +t.toFixed(4), frame: Math.round(t * 30), scene, visibleAssets, captions };
};

/* ================================ READY ================================ */
const load = img => new Promise((res, rej) => {
  if (img.complete && img.naturalWidth) return res();
  img.onload = () => res(); img.onerror = () => rej(new Error('Asset missing: ' + img.src));
}).then(() => (img.decode ? img.decode().catch(() => {}) : 0));
const FONTS = ['800 56px "Adwaita Sans"', '600 32px "Adwaita Sans"', '500 28px "Adwaita Sans"', '700 24px "JetBrainsMono Nerd Font"', '600 34px "JetBrainsMono Nerd Font"'];
const fontsReady = document.fonts
  ? Promise.all([...FONTS.map(f => document.fonts.load(f).catch(() => [])), document.fonts.load('32px "Noto Color Emoji"', '\u{1F30B}').catch(() => [])]).then(() => document.fonts.ready)
  : Promise.resolve();
const logoReady = LOGOS.reduce((p, src) => p.catch(() => new Promise((res, rej) => {
  const i = new Image(); i.onload = () => res(src); i.onerror = rej; i.src = src;
})), Promise.reject()).then(src => {
  LOGO_SRC = src;
  return Promise.all([...document.querySelectorAll('img.logo')].map(i => { i.src = src; return load(i); }));
}, () => { throw new Error('Logo missing: ' + LOGOS.join(' | ')); });
window.READY = window.ready = Promise.all([fontsReady, logoReady, ...SHOTS.map(s => load(s.img))]).then(() => {
  const warnings = SHOTS.filter(s => s.img.naturalWidth !== s.W || s.img.naturalHeight !== s.H)
    .map(s => `${s.src}: expected ${s.W}x${s.H}, got ${s.img.naturalWidth}x${s.img.naturalHeight}`);
  if (LOGO_SRC !== LOGOS[0]) warnings.push('Logo fallback: ' + LOGO_SRC);
  render(0);
  return { ok: true, ...window.FILM, warnings };
});
window.READY.catch(e => console.error('[omagma film] READY rejected:', e));

const fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); ST.style.transform = k < 0.999 ? `scale(${k})` : ''; };
addEventListener('resize', fit); fit();
render(0);
})();
</script>
</body>
