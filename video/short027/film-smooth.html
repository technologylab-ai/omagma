<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Omagma v0.2.7 — continuous edit</title>
<style>

.intro,.outro{position:absolute;inset:0;text-align:center}.logo{position:absolute;left:845px;top:200px;width:230px;height:230px}.intro .word{position:absolute;top:452px;width:100%;font-size:110px;font-weight:800;letter-spacing:-.02em}.version{position:absolute;top:604px;width:100%;font:700 34px "JetBrainsMono Nerd Font",monospace;color:#ff9e61;letter-spacing:.12em}.count{position:absolute;top:686px;width:100%;font-size:44px;font-weight:600;color:#f3dccb}.intro-bars{position:absolute;top:774px;left:0;width:100%;display:flex;gap:14px;justify-content:center}.intro-bars i{display:block;width:46px;height:6px;background:#ff8a45;border-radius:3px;box-shadow:0 0 14px #ff7a35b3}

.outro .logo{left:850px;top:210px;width:220px;height:220px}.outro .title{position:absolute;top:490px;width:100%;font-size:70px;font-weight:800}.outro .pill{position:absolute;top:615px;width:100%}.pill span{display:inline-block;font-size:32px;font-weight:700;color:#1c0e06;background:#ff9e61;padding:12px 34px;border-radius:40px}.website{position:absolute;top:712px;width:100%;font:600 34px "JetBrainsMono Nerd Font",monospace;color:#ffd6bb}.foot{position:absolute;top:990px;width:100%;font-size:22px;color:#a88b78;letter-spacing:.06em}
</style></head><body><div id="screen"></div><script>
(() => {
'use strict';
const ROOT='/video/cache/short027/assets/',screen=document.getElementById('screen');
const clamp=x=>Math.max(0,Math.min(1,x)),sm=x=>x*x*(3-2*x),lerp=(a,b,p)=>a+(b-a)*p;
const ease=(t,a,b)=>sm(clamp((t-a)/(b-a))),fmt=s=>s.replace(/\{(.+?)\}/g,'<kbd>$1</kbd>').replace(/`(.+?)`/g,'<code>$1</code>');
let plan,manifest,chapters,images={},layers=[],chrome,state={};
const FR=[160,212,1600,840],SF=1600/3520,RR=[960-680*(830/1124),214,1360*(830/1124),830],SR=830/1124;
const titles=['','Start from your bar','Find a command','Find inside the message','Choose labels. Apply once.','Meetings, made readable','Pick files together','Forward with a personal note','Send with a safety net','Update on your terms'];
const subs={
 'bar':'Open TUI runs `omagma tui`','inbox':'Open TUI runs `omagma tui`',
 'palette untouched':'{Ctrl P} in the mailbox · type a word to see matching actions','palette typing':'{Ctrl P} in the mailbox · type a word to see matching actions','palette narrowed':'Matching actions · choose the command you need',
 'find first':'Find “calm” inside the message','find next':'{n} jumps to the next match',
 'labels initial':'Changes stay local until Apply.','stage one':'Stage it: remove Projects, add Travel','stage two':'Stage it: remove Projects, add Travel','apply labels':'Apply once · both selected messages update','labels result':'Applied · Travel replaces Projects on both messages',
 'meeting card':'A meeting invitation, visible beside the message','meeting review':'{I} opens a friendly review of the invitation','join':'In the review, {o} joins the meeting',
 'files':'Check several files, then attach them at once','attached':'All three files are attached to the draft',
 'received airline':'Received airline email','forward menu':'{f} opens the forward menu','keep formatting':'{k} keeps the original HTML formatting','empty note':'Blank personal note · original protected','note typing':'Type in Markdown · the live preview follows','finished note':'Your note above the original airline email','browser note':'Original HTML formatting preserved below your note','browser scroll':'Original HTML formatting preserved below your note','original HTML':'Original HTML formatting preserved below your note',
 'send review':'Review first · confirm to start the countdown','countdown':'{Ctrl Z} cancels before anything is sent','canceled':'Canceled · your editable draft is kept',
 'upgrade card':'A quiet notice. The exact steps when you’re ready.','how to update':'A quiet notice. The exact steps when you’re ready.','update guide':'A quiet notice. The exact steps when you’re ready.'
};
const names=['logo.png','bar.png','main.png','palette-initial-detail.png','palette-l-detail.png','palette-la-detail.png','palette-lab-detail.png','palette-labe-detail.png','palette-label-detail.png','find.png','find-next.png','labels-context.png','labels-initial-detail.png','labels-stage-one-detail.png','labels-staged-detail.png','labels-result.png','meeting-review-detail.png','join-detail.png','composer.png','files-detail.png','attached.png','send-review-detail.png','countdown.png','countdown-detail.png','send-canceled.png','updates-card-detail.png','updates-card-focused-detail.png','updates-guide-detail.png'];
const full=(asset,extra={})=>({asset,rect:FR,center:[1760,924],scale:SF,...extra});
function detail(asset,mw=1440,mh=800,extra={}){const im=images[asset],s=Math.min(mw/im.naturalWidth,mh/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;return{asset,rect:[960-w/2,632-h/2,w,h],center:[im.naturalWidth/2,im.naturalHeight/2],scale:s,kind:'detail',...extra};}
function phaseAt(t){const f=Math.min(plan.frameCount-1,Math.floor(Math.max(0,t)*plan.fps+1e-7));return plan.parts.findIndex(p=>f<p.frameOut);}
function descriptor(i,t){
 const p=plan.parts[i],start=p.frameIn/plan.fps,local=t-start,n=p.name,d={phase:n,chapter:p.chapter,subtitle:subs[n]||'',views:[]};
 const part=name=>plan.parts.find(p=>p.name===name).frameIn/plan.fps;
 switch(n){
 case 'intro':case 'recap':case 'outro':return d;
 case 'bar':d.views=[detail('bar.png',1500,800,{focus:[966,12,138,48]})];break;
 case 'inbox':{
  const q=ease(local,0,.75);d.views=[detail('bar.png',1500,800,{opacity:1-ease(local,0,.52),focus:[966,12,138,48]}),full('main.png',{reveal:q,zoom:lerp(.985,1,q)})];d.reveal=q;break;
 }
 case 'palette untouched':case 'palette typing':case 'palette narrowed':{
  let asset='palette-initial-detail.png';if(n==='palette narrowed')asset='palette-label-detail.png';
  if(n==='palette typing'){const sequence=['palette-l-detail.png','palette-la-detail.png','palette-lab-detail.png','palette-labe-detail.png','palette-label-detail.png'];asset=sequence[Math.min(4,Math.floor(clamp(local/1.8)*5))];}
  const im=images[asset],s=.87,w=im.naturalWidth*s,h=im.naturalHeight*s;
  d.views=[full('main.png',{brightness:.42}),{asset,rect:[960-w/2,264,w,h],center:[im.naturalWidth/2,im.naturalHeight/2],scale:s,kind:'detail'}];break;
 }
 case 'find first':case 'find next':d.views=[full(n==='find first'?'find.png':'find-next.png',{focus:[2186,100,1330,1650]})];break;
 case 'labels initial':case 'stage one':case 'stage two':case 'apply labels':{
  const asset=n==='labels initial'?'labels-initial-detail.png':n==='stage one'?'labels-stage-one-detail.png':'labels-staged-detail.png';
  d.views=[full('labels-context.png',{brightness:.42}),detail(asset,1400,800,n==='apply labels'?{focus:[502,918,206,54]}:{})];break;
 }
 case 'labels result':{
  const q=ease(local,.4,1.6);d.views=[{asset:'labels-result.png',rect:FR.map((v,k)=>lerp(v,RR[k],q)),center:[lerp(1760,2840,q),lerp(924,648,q)],scale:lerp(SF,SR,q),focus:[2214,304,770,52]}];break;
 }
 case 'meeting card':{
  const q=ease(local,0,.35),a=[2214,304,770,52],b=[2214,388,1276,102];d.views=[{asset:'labels-result.png',rect:RR,center:[2840,648],scale:SR,focus:a.map((v,k)=>lerp(v,b[k],q))}];break;
 }
 case 'meeting review':d.views=[detail('meeting-review-detail.png',1440,800)];break;
 case 'join':{
  const q=ease(local,.12,.92),s=lerp(800/1320,.75,q);d.views=[{asset:'join-detail.png',rect:[960-1333.333333/2,232,1333.333333,800],center:[lerp(1100,900,q),lerp(660,740,q)],scale:s,kind:'detail',focus:[1424,1182,190,56],focusAlpha:ease(local,0,.25)}];d.join=q;break;
 }
 case 'files':d.views=[full('composer.png',{brightness:.42}),detail('files-detail.png',1560,700)];break;
 case 'attached':{
  const q=ease(local,.45,1.2),target=[120,212,1680,840];d.views=[{asset:'attached.png',rect:FR.map((v,k)=>lerp(v,target[k],q)),center:[lerp(1760,1056,q),lerp(924,1320,q)],scale:lerp(SF,840/1056,q),focus:[30,1536,2050,182],focusAlpha:ease(local,.8,1.2)}];break;
 }
 case 'received airline':d.views=[full(manifest.receivedAsset)];break;
 case 'forward menu':case 'keep formatting':d.views=[full(manifest.receivedAsset,{brightness:.42}),detail(manifest.menuAsset,1440,650,n==='keep formatting'?{focus:[40,130,424,48]}:{})];break;
 case 'empty note':d.views=[full(manifest.emptyAsset)];break;
 case 'note typing':{
  const count=Math.floor(clamp(local/2.8)*manifest.typingCharacterCounts.at(-1));let j=-1;manifest.typingCharacterCounts.forEach((x,k)=>{if(x<=count)j=k;});
  d.views=[full(j<0?manifest.emptyAsset:manifest.typingAssets[j])];d.typingIndex=j;d.typedCharacters=j<0?0:manifest.typingCharacterCounts[j];break;
 }
 case 'finished note':d.views=[full(manifest.finalAsset)];break;
 case 'browser note':case 'browser scroll':case 'original HTML':{
  const q=ease(t,part('browser scroll'),part('original HTML'));d.views=[{asset:manifest.browserAsset,rect:[300,212,1320,840],center:[1000,lerp(836,2660,q)],scale:.66,kind:'paper'}];d.scroll=q;break;
 }
 case 'send review':d.views=[{asset:'send-review-detail.png',rect:[160,252,1600,760],center:[1760,836],scale:SF,focus:[212,1536,190,50]}];break;
 case 'countdown':d.views=[full('countdown.png'),{asset:'countdown-detail.png',rect:[154,604,1612,55],center:[645,66],scale:1.25,kind:'detail'}];break;
 case 'canceled':d.views=[full('send-canceled.png',{focus:[4,1800,690,46]})];break;
 case 'upgrade card':case 'how to update':d.views=[detail(n==='upgrade card'?'updates-card-detail.png':'updates-card-focused-detail.png',1113,290)];break;
 case 'update guide':d.views=[{asset:'updates-guide-detail.png',rect:[403,200,1113,823],center:[images['updates-guide-detail.png'].naturalWidth/2,images['updates-guide-detail.png'].naturalHeight/2],scale:1113/images['updates-guide-detail.png'].naturalWidth,kind:'detail'}];break;
 default:throw Error('Unknown visible phase '+n);
 }
 return d;
}
function makeLayer(){
 const el=document.createElement('div');el.className='scene';el.innerHTML='<div class="caption"><div class="number"></div><h1></h1><p class="subtitle"></p></div><div class="bug">Omagma v0.2.7<div class="segs"></div></div><div class="views"></div><div class="special"></div><div class="disclosure"></div><div class="guide-only"></div>';
 const segs=el.querySelector('.segs');for(let i=0;i<9;i++){const x=document.createElement('i');x.append(document.createElement('b'));segs.append(x);}
 const slots=Array.from({length:3},()=>{const host=document.createElement('div');host.className='native';const image=document.createElement('img');image.decoding='sync';const focus=document.createElement('div');focus.className='focus';host.append(image,focus);el.querySelector('.views').append(host);return{host,image,focus,asset:null};});
 const edge=document.createElement('div');edge.className='edge';el.querySelector('.views').append(edge);screen.append(el);return{el,slots,edge};
}
function drawView(slot,v){
 const {host,image,focus}=slot;host.style.display='block';host.className='native'+(v.kind?' '+v.kind:'');host.style.opacity=String(v.opacity??1);host.style.filter='brightness('+(v.brightness??1)+')';host.style.clipPath=v.reveal===undefined?'none':`inset(0 ${(1-v.reveal)*100}% 0 0 round 16px)`;
 const [x,y,w,h]=v.rect;Object.assign(host.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',transform:'scale('+(v.zoom??1)+')',transformOrigin:'50% 50%'});
 const im=images[v.asset],vw=w/v.scale,vh=h/v.scale,cx=vw>=im.naturalWidth?im.naturalWidth/2:Math.max(vw/2,Math.min(im.naturalWidth-vw/2,v.center[0])),cy=vh>=im.naturalHeight?im.naturalHeight/2:Math.max(vh/2,Math.min(im.naturalHeight-vh/2,v.center[1]));
 if(slot.asset!==v.asset){image.src=im.src;slot.asset=v.asset;}image.style.transform=`translate(${w/2-cx*v.scale}px,${h/2-cy*v.scale}px) scale(${v.scale})`;
 if(v.focus){const [rx,ry,rw,rh]=v.focus;focus.style.display='block';Object.assign(focus.style,{left:((rx-cx)*v.scale+w/2-8)+'px',top:((ry-cy)*v.scale+h/2-8)+'px',width:(rw*v.scale+16)+'px',height:(rh*v.scale+16)+'px',opacity:String(v.focusAlpha??1)});}else focus.style.display='none';
 return{asset:v.asset,rect:v.rect,center:[cx,cy],scale:v.scale,brightness:v.brightness??1};
}
function special(layer,d,local){
 const h=layer.el.querySelector('.special');
 if(!['intro','recap','outro'].includes(d.phase)){h.style.display='none';layer.specialPhase=d.phase;return;}
 h.style.display='block';
 if(layer.specialPhase===d.phase){if(d.phase==='intro'){h.style.opacity=String(ease(local,0,.8));h.style.transform=`translateY(${12*(1-ease(local,0,.8))}px)`;}return;}
 layer.specialPhase=d.phase;
 if(d.phase==='intro'){
  h.innerHTML='<div class="intro"><img class="logo" src="'+images['logo.png'].src+'"><div class="word">Omagma</div><div class="version">v0.2.7</div><div class="count">9 highlights</div><div class="intro-bars">'+Array.from({length:9},()=>'<i></i>').join('')+'</div></div>';
  h.style.opacity=String(ease(local,0,.8));h.style.transform=`translateY(${12*(1-ease(local,0,.8))}px)`;
 }else if(d.phase==='recap'){
  const cards=[['More everyday wins:',['Choose themes + search Help','Save searches + color labels','Names in To/Cc/Bcc + choose sender','Jump to unread + half-page scroll']],['Safer, smoother everywhere:',['Archive a message or whole thread','Mark spam + discard local drafts','Attachment reminders + Tab to buttons','Resume or cancel paused sends']]];
  h.innerHTML=cards.map(([title,rows],i)=>'<div class="card" style="left:'+(120+i*860)+'px"><div class="title">'+title+'</div>'+rows.map(r=>'<div class="row">'+r+'</div>').join('')+'</div>').join('');h.style.opacity='1';h.style.transform='none';
 }else if(d.phase==='outro'){
  h.innerHTML='<div class="outro"><img class="logo" src="'+images['logo.png'].src+'"><div class="title">What’s new in v0.2.7</div><div class="pill"><span>Get Omagma</span></div><div class="website">technologylab-ai.github.io/omagma</div><div class="foot">Experimental · TUI &amp; CLI · Linux/macOS</div></div>';h.style.opacity='1';h.style.transform='none';
 }else h.style.display='none';
}
function draw(layer,d,t,i){
 const p=plan.parts[i],local=t-p.frameIn/plan.fps;
 layer.el.querySelector('.caption').style.display='none';layer.el.querySelector('.bug').style.display='none';
 layer.el.querySelector('.number').textContent=String(d.chapter).padStart(2,'0')+'/09';layer.el.querySelector('h1').textContent=titles[d.chapter]||'';layer.el.querySelector('.subtitle').innerHTML=fmt(d.subtitle);
 layer.el.querySelectorAll('.segs b').forEach((b,k)=>b.style.transform='scaleX('+(k<d.chapter?1:0)+')');
 layer.slots.forEach((slot,k)=>{if(d.views[k])drawView(slot,d.views[k]);else slot.host.style.display='none';});
 layer.edge.style.display=d.reveal>0&&d.reveal<1?'block':'none';layer.edge.style.left=(160+1600*(d.reveal||0))+'px';layer.edge.style.opacity=String(Math.sin(Math.PI*(d.reveal||0))*.7);
 const upgrade=d.chapter===9;layer.el.querySelector('.disclosure').textContent=upgrade?'Illustrative update demo · 0.2.8 fixture':'';layer.el.querySelector('.guide-only').textContent=d.phase==='update guide'?'Guide only · nothing installs automatically':'';
 special(layer,d,local);
}
function drawChrome(i,t,d){
 const p=plan.parts[i],local=t-p.frameIn/plan.fps,pd=i?descriptor(i-1,(p.frameIn-1)/plan.fps):null;
 const chapterChanged=pd&&pd.chapter!==d.chapter,subChanged=pd&&pd.subtitle!==d.subtitle;
 let text=d,opacity=1,subOpacity=1;
 if(chapterChanged&&local<.34){text=local<.14?pd:d;opacity=local<.14?1-ease(local,0,.14):ease(local,.14,.34);}
 else if(subChanged&&local<.28){text={...d,subtitle:local<.12?pd.subtitle:d.subtitle};subOpacity=local<.12?1-ease(local,0,.12):ease(local,.12,.28);}
 chrome.style.display=text.chapter?'block':'none';chrome.style.opacity=String(opacity);
 chrome.querySelector('.number').textContent=String(text.chapter).padStart(2,'0')+'/09';chrome.querySelector('h1').textContent=titles[text.chapter]||'';const sub=chrome.querySelector('.subtitle');sub.innerHTML=fmt(text.subtitle);sub.style.opacity=String(subOpacity);
 chrome.querySelectorAll('.segs b').forEach((b,k)=>b.style.transform='scaleX('+(k<text.chapter?1:0)+')');
}
window.render=tIn=>{
 if(!plan)return false;const t=Math.max(0,Math.min(plan.duration-1/plan.fps,Number(tIn)||0)),i=phaseAt(t),p=plan.parts[i],start=p.frameIn/plan.fps,d=descriptor(i,t),q=p.transition?ease(t,start,start+p.transition):1;
 // One fully opaque scene remains underneath the incoming scene. Every
 // scene paints the exact same background, so opacity never pulses it.
 if(q<1&&i>0){const pt=(p.frameIn-1)/plan.fps,pd=descriptor(i-1,pt);draw(layers[0],pd,pt,i-1);layers[0].el.style.display='block';layers[0].el.style.opacity='1';}else layers[0].el.style.display='none';
 draw(layers[1],d,t,i);layers[1].el.style.display='block';layers[1].el.style.opacity=String(q);
 drawChrome(i,t,d);
 state={t,frame:Math.floor(t*plan.fps+1e-7),scene:d.chapter?String(d.chapter).padStart(2,'0')+'/09':d.phase,phase:d.phase,transition:q,visibleAssets:d.views.map(v=>v.asset),captions:d.chapter?[titles[d.chapter],d.subtitle.replace(/[{}]/g,'')]:[d.phase],motion:{reveal:d.reveal,join:d.join,scroll:d.scroll,typingIndex:d.typingIndex,typedCharacters:d.typedCharacters},background:'constant',globalFlash:0};return true;
};
window.qa=t=>{window.render(t);return state;};
// Await each newly selected bitmap before a renderer captures the frame.
// Two animation frames alone do not establish that a changed img is decoded.
window.prepareFrame=()=>Promise.all(layers.filter(l=>l.el.style.display!=='none').flatMap(l=>Array.from(l.el.querySelectorAll('img')).filter(im=>im.closest('.native')?im.closest('.native').style.display!=='none':im.closest('.special').style.display!=='none')).map(im=>im.decode()));
window.READY=Promise.all([fetch('smooth.json').then(r=>r.json()),fetch('/video/cache/short027/forward-story-manifest.json').then(r=>r.json()),document.fonts.ready]).then(async([p,m])=>{
 plan=p;manifest=m;chapters=Array.from({length:9},(_,k)=>plan.parts.find(p=>p.chapter===k+1).frameIn/plan.fps);
 names.push(manifest.receivedAsset,manifest.menuAsset,manifest.emptyAsset,manifest.finalAsset,manifest.browserAsset,...manifest.typingAssets);
 await Promise.all([...new Set(names)].map(async name=>{const img=new Image();img.decoding='sync';img.src=ROOT+name;await img.decode();images[name]=img;}));
 await Promise.all(['800 56px "Adwaita Sans"','700 24px "JetBrainsMono Nerd Font"','32px "Noto Color Emoji"'].map(f=>document.fonts.load(f)));await document.fonts.ready;
 layers=[makeLayer(),makeLayer()];chrome=document.createElement('div');chrome.innerHTML='<div class="caption"><div class="number"></div><h1></h1><p class="subtitle"></p></div><div class="bug">Omagma v0.2.7<div class="segs">'+Array.from({length:9},()=>'<i><b></b></i>').join('')+'</div></div>';screen.append(chrome);window.FILM={width:1920,height:1080,fps:plan.fps,frameCount:plan.frameCount,duration:plan.duration,parts:plan.parts,chapters};window.render(0);return{ok:true,...window.FILM,warnings:[]};
});
const fit=()=>{screen.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';};addEventListener('resize',fit);fit();
})();
</script></body></html>
