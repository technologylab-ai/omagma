<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Heavy Lifting — What's new in Omagma v0.2.18</title>
<link rel="stylesheet" href="film.css">
</head>
<body>
<div id="stage" aria-hidden="true">
  <div id="bg" class="L full"></div>
  <div id="contours" class="L"></div>
  <div id="glow" class="L"></div>
  <div id="embers" class="L full"></div>

  <!-- Actual native/browser captures; frames are built by film.js from the capture manifest. -->
  <div id="frames" class="L full"></div>

  <div id="burst"><div class="heat"></div><div class="ring"></div></div>

  <!-- Editorial guidance overlays (outside captured pixels' meaning). -->
  <div id="bead"><div class="tail"></div><div class="ripple"></div><div class="core"></div></div>
  <div id="pointer">
    <div class="press"></div>
    <svg width="40" height="52" viewBox="0 0 40 52"><path d="M4 3 L4 42 L14 33 L21 49 L28 46 L21 30 L35 30 Z" fill="#fbf6f0" stroke="#ec7a35" stroke-width="3" stroke-linejoin="round"/></svg>
  </div>
  <div id="keys"></div>

  <div id="bandA" class="band"><div class="kicker"><span></span><i></i></div><div class="head"></div><div class="sub"></div><div class="foot"><b></b><span></span></div></div>
  <div id="bandB" class="band"><div class="kicker"><span></span><i></i></div><div class="head"></div><div class="sub"></div><div class="foot"><b></b><span></span></div></div>

  <div id="recap" class="L full">
    <div id="rc-kicker"><span>+ ALSO NEW</span><i></i></div>
    <div id="rc-title">And smaller <span class="hl">wins:</span></div>
    <div id="rc-rows"></div>
  </div>

  <div id="bug" class="L"><img src="/video/assets/omagma-logo-master.png" alt=""><span class="name">Omagma</span><span class="ver">v0.2.18</span></div>

  <div id="lockup" class="L full">
    <div id="lk-pos">
      <div id="lk-halo"></div>
      <div id="lk-ember"></div>
      <div id="lk-logo" class="logo-wrap"><img src="/video/assets/omagma-logo-master.png" alt=""><div class="flow"></div></div>
    </div>
    <div id="lk-seam" class="seam"></div>
    <div id="lk-word-clip"><div id="lk-word">Omagma</div></div>
    <div id="lk-meta"><span class="pill">v0.2.18</span><span class="muted">What’s new · Out now</span></div>
  </div>

  <div id="outro" class="L full">
    <div id="o-pos">
      <div id="o-halo"></div>
      <div id="o-ring"></div>
      <div id="o-logo" class="logo-wrap"><img src="/video/assets/omagma-logo-master.png" alt=""><div class="flow"></div></div>
    </div>
    <div id="o-title">Omagma<span class="v">v0.2.18</span></div>
    <div id="o-now"><span>Out now</span></div>
    <div id="o-url">technologylab-ai.github.io/omagma</div>
    <div id="o-fine">Experimental TUI &amp; CLI · Linux &amp; macOS</div>
  </div>

  <div id="vignette" class="L full"></div>
  <div id="fade" class="L full"></div>
</div>
<script src="film.js"></script>
</body>
</html>
