 const ms=layer.mask.style;if(st.mask){const q=project(st,st.mask);ms.display='block';ms.left=css(q[0]-x)+'px';ms.top=css(q[1]-y)+'px';ms.width=css(q[2])+'px';ms.height=css(q[3])+'px';ms.background=backgrounds[st.asset];}else ms.display='none';
 const ss=layer.spot.style;
 if(st.spot){const q=project(st,st.spot.roi),[px,py]=st.spotPad,sh=q[3]+2*py;ss.display='block';ss.left=round(q[0]-x-px)+'px';ss.top=round(q[1]-y-py)+'px';ss.width=round(q[2]+2*px)+'px';ss.height=round(sh)+'px';ss.borderRadius=round(Math.min(sh/2,22))+'px';ss.boxShadow='0 0 0 3200px rgba(4,9,15,'+round(.6*st.spot.alpha,3)+')';}
 else ss.display='none';
}
function hideLayer(layer){layer.pane.style.display='none';layer.pane.dataset.on='0';}

function fitCaptions(){
 const h=caption.querySelector('.title-slot .current'),s=caption.querySelector('.subtitle-slot .current'),width=caption.clientWidth;
 plan.parts.forEach(part=>{
  if(part.headline&&!headingSizes.has(part.headline)){let size=56;h.textContent=part.headline;h.style.fontSize=size+'px';while(h.scrollWidth>width+1&&size>46){size-=2;h.style.fontSize=size+'px';}if(h.scrollWidth>width+1)fail('Headline exceeds the caption width '+part.id);headingSizes.set(part.headline,size);}
  s.textContent=part.subtitle;if(s.scrollWidth>width+1)fail('Subtitle exceeds the caption width '+part.id);
 });
 h.textContent='';s.textContent='';
}
function drawCaption(index,local){
 const part=plan.parts[index],prev=index>0?plan.parts[index-1]:null,span=Math.max(.5,part.carry);
 const slot=(name,now,before)=>{
  const host=caption.querySelector('.'+name+'-slot'),cur=host.querySelector('.current'),old=host.querySelector('.previous'),changed=prev!==null&&now!==before;
  const incoming=changed?progress(local,.16,.34):1,outgoing=changed?1-progress(local,0,.14):0;
  cur.textContent=now;old.textContent=before;cur.style.opacity=String(now?round(incoming,4):0);old.style.opacity=String(before?round(outgoing,4):0);cur.style.transform='translateY('+round((1-incoming)*10)+'px)';
  if(name==='title'){cur.style.fontSize=(headingSizes.get(now)||56)+'px';old.style.fontSize=(headingSizes.get(before)||56)+'px';}
  return{text:now,incoming:round(incoming,3),outgoing:round(outgoing,3)};
 };
 const headline=slot('title',part.headline||'',prev&&prev.headline||''),subtitle=slot('subtitle',part.subtitle,prev?prev.subtitle:'');
 const shown=!!part.headline,was=!!(prev&&prev.headline);
 bug.style.opacity=String(round(shown&&was?1:shown?progress(local,.25*span,span):was?1-progress(local,0,.55*span):0,4));
 return{headline,subtitle};
}
function partAt(frame){let lo=0,hi=plan.parts.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(frame<plan.parts[mid].frameOut)hi=mid;else lo=mid+1;}return lo;}

window.render=function(tIn){
 if(!plan)return null;
 const t=clamp(Number(tIn)||0,0,LAST),frame=Math.min(FRAMES-1,Math.floor(t*FPS+1e-7)),index=partAt(frame),part=plan.parts[index],local=t-part.frameIn/FPS;
 const prev=index>0?plan.parts[index-1]:null,prevLocal=prev?local+(prev.frameOut-prev.frameIn)/FPS:0,carry=prev&&part.carry>0?progress(local,0,part.carry):1,draws=[];
 // Native action changes use opaque replacements; only the opening and closing brand transitions carry a previous plane.
 if(prev&&carry<1){const fade=1-progress(local,.3*part.carry,part.carry);evalPart(prev,prevLocal).list.forEach(st=>{if(st.opacity*fade>.002)draws.push({part:prev.id,st,alpha:st.opacity*fade});});}
 evalPart(part,local).list.forEach(st=>{if(st.opacity>.002)draws.push({part:part.id,st,alpha:st.opacity});});
 if(draws.length>layers.length)fail('Too many simultaneous native layers at '+t.toFixed(3));
 draws.forEach((d,i)=>drawLayer(layers[i],d.st,d.alpha));for(let i=draws.length;i<layers.length;i++)hideLayer(layers[i]);
 const direction=window.DIRECTION.render({t,index,part,prev,local,prevLocal,carry,parts:plan.parts,logo:logo.url,geom:(i,time)=>evalPart(plan.parts[i],time),project},hosts);
 const captions=drawCaption(index,local);
 current={t:round(t,5),frame,phase:part.id,title:part.title,local:round(local,4),partFrames:[part.frameIn,part.frameOut],transition:round(carry,4),
  visibleAssets:[...new Set(draws.map(d=>d.st.asset))],
  views:draws.map(d=>({part:d.part,id:d.st.id,asset:d.st.asset,crop:d.st.roi.map(v=>round(v,5)),pane:d.st.pane.map(v=>round(v,2)),scale:round(d.st.scale,5),opacity:round(d.alpha,4),dim:round(d.st.dim,4),spot:d.st.spot?{crop:d.st.spot.roi.map(v=>round(v,5)),alpha:round(d.st.spot.alpha,3)}:null,moving:d.st.moving})),
  captions:[part.headline,part.subtitle].filter(Boolean),visibleCaptions:[captions.headline,captions.subtitle].filter(c=>c.text&&c.incoming>0).map(c=>c.text),textSlots:captions,
  cues:direction.cues,overlays:direction.overlays,background:'constant #0b1017',source:'genuine native capture assets',publication:'held'};
 return current;
};
window.qa=function(t){return JSON.parse(JSON.stringify(window.render(t)));};
window.prepareFrame=async function(){
 const pending=[];document.querySelectorAll('#screen img').forEach(im=>{const pane=im.closest('.pane');if(pane&&pane.style.display==='none')return;pending.push(im.decode().catch(()=>fail('Image decode failed '+(im.dataset.asset||'logo'))));});
 await Promise.all(pending);await document.fonts.ready;return true;
};
window.READY=(async function(){
 const[timeline,assetManifest]=await Promise.all([fetchJSON(timelineURL),fetchJSON(manifestURL)]);
 if(!window.DIRECTION)fail('direction.js did not load');
 plan=normalizePlan(timeline);
 plan.parts.forEach(part=>window.DIRECTION.validate(part,{fail,duration:(part.frameOut-part.frameIn)/FPS,hasView:id=>part.views.some(v=>v.id===id)}));
 const used=[...new Set(plan.parts.flatMap(p=>p.captures))].sort();
 manifest=validateManifest(assetManifest,used);
 const rois=requiredRois();
 await Promise.all(used.map(loadAsset));logo=await loadLogo();
 await Promise.all(['800 56px "Adwaita Sans"','500 28px "Adwaita Sans"','650 30px "Adwaita Sans"','780 36px "Adwaita Sans"','800 40px "JetBrainsMono Nerd Font"','700 19px "JetBrainsMono Nerd Font"'].map(f=>document.fonts.load(f)));await document.fonts.ready;
 for(let i=0;i<MAX_LAYERS;i++)layers.push(newLayer());
 fitCaptions();
 // Exercise every frame once so cameras, references and anchors fail here rather than mid-render.
 for(let f=0;f<FRAMES;f++)window.render(f/FPS);
 window.FILM={width:1920,height:1080,fps:FPS,frameCount:FRAMES,duration:DURATION,revision:plan.revision,
  parts:plan.parts.map(p=>({id:p.id,frameIn:p.frameIn,frameOut:p.frameOut,title:p.title,headline:p.headline,subtitle:p.subtitle,captures:p.captures})),
  assets:Object.fromEntries(used.map(k=>[k,{file:manifest.assets[k].file,width:manifest.assets[k].width,height:manifest.assets[k].height,sha256:manifest.assets[k].sha256.toLowerCase()}])),
  requiredRois:rois,manifest:manifestURL.pathname,manifestSchema:manifest.schema,logo:logo.path};
 window.render(0);await window.prepareFrame();
 return{ok:true,...window.FILM,warnings:[]};
})().catch(failure);
function fit(){screen.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';}addEventListener('resize',fit);fit();
})();
</script></body></html>
