name: Native macOS CLI and TUI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.ci-zig/global

concurrency:
  group: omagma-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify compiler, dependencies and SDK cache inputs
        id: cache-inputs
        run: python3 .github/ci_cache_key.py
      - name: Cache the verified compiler archive and Safe compilation
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.tool_cache }}/omagma-zig
            .ci-zig/global
          key: zig-safe-pr-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}
          restore-keys: |
            zig-safe-pr-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}
      - name: Install exact Linux compiler
        run: python3 .github/install_zig.py
      - name: Preserve the Linux static-musl CLI and TUI
        run: |
          set -e
          for mode in safe; do
            zig build probes -Doptimize="$mode" -Dtarget=x86_64-linux-musl -j2 --summary all --prefix ".verification-linux-$mode" --test-timeout 120s -Dtest-watchdog=true
            zig build -Doptimize="$mode" -Dtarget=x86_64-linux-musl -j2 --prefix ".verification-linux-$mode"
            python3 tests/calendar_native_http.py --probe ".verification-linux-$mode/bin/calendar_http_probe"
            python3 tests/terminal_integration.py --binary ".verification-linux-$mode/bin/omagma" --build-mode "$mode"
            python3 tests/terminal_compose_actions.py --binary ".verification-linux-$mode/bin/omagma"
            python3 tests/terminal_draft_conflict.py --binary ".verification-linux-$mode/bin/omagma"
            python3 tests/terminal_draft_paging.py --binary ".verification-linux-$mode/bin/omagma"
            python3 tests/terminal_quote_policy.py --binary ".verification-linux-$mode/bin/omagma"
            python3 tests/terminal_reply_boundaries.py --binary ".verification-linux-$mode/bin/omagma"
            python3 tests/terminal_settled_recovery.py --binary ".verification-linux-$mode/bin/omagma"
          done
      - name: Linux first-use mail, Calendar and vault workflows
        run: |
          for mode in safe; do
            python3 tests/terminal_workflow_regressions.py --binary ".verification-linux-$mode/bin/omagma" --build-mode "$mode" --output "tests/results/workflows-linux-$mode.json"
          done
      - name: Safe native unit correctness and retained-history stress
        run: |
          zig build test -Doptimize=safe -Dtarget=x86_64-linux-musl -j2 --summary all --test-timeout 120s -Dtest-watchdog=true
          zig build test-native-history-stress -Doptimize=safe -Dtarget=x86_64-linux-musl -j2 --summary all --test-timeout 1200s -Dtest-watchdog=true
      - name: Preserve synthetic workflow receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflows-linux-x86_64
          path: tests/results/workflows-*.json
          if-no-files-found: warn
          retention-days: 30
  native:
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runner labels identify the actual native architecture.
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify compiler, dependencies and SDK cache inputs
        id: cache-inputs
        run: python3 .github/ci_cache_key.py
      - name: Cache the verified compiler archive and Safe compilation
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.tool_cache }}/omagma-zig
            .ci-zig/global
          key: zig-safe-pr-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}
          restore-keys: |
            zig-safe-pr-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}
      - name: Install exact compiler from checked native archive metadata
        run: python3 .github/install_zig.py
      - name: Native correctness and probes
        run: |
          set -e
          zig version
          uname -m
          for mode in safe; do
            zig build probes -Doptimize="$mode" -j2 --prefix ".verification-macos-$mode" --summary all --test-timeout 120s -Dtest-watchdog=true
            zig build -Doptimize="$mode" -j2 --prefix ".verification-macos-$mode"
            binary=".verification-macos-$mode/bin/omagma"
            "$binary" build-info
            "$binary" probe-keyring
            python3 tests/terminal_integration.py --binary "$binary" --build-mode "$mode"
            python3 tests/terminal_compose_actions.py --binary "$binary"
            python3 tests/terminal_draft_conflict.py --binary "$binary"
            python3 tests/terminal_draft_paging.py --binary "$binary"
            python3 tests/terminal_quote_policy.py --binary "$binary"
            python3 tests/terminal_reply_boundaries.py --binary "$binary"
            python3 tests/terminal_settled_recovery.py --binary "$binary"
            python3 tests/terminal_macos.py --binary "$binary"
            python3 tests/terminal_transport.py --binary "$binary" --build-mode "$mode"
            python3 tests/launch_macos.py --binary "$binary"
            ".verification-macos-$mode/bin/auth_probe" launch
            ".verification-macos-$mode/bin/auth_probe" callback
            python3 tests/calendar_native_http.py --probe ".verification-macos-$mode/bin/calendar_http_probe"
          done
      - name: Native first-use mail, Calendar and vault workflows
        run: |
          for mode in safe; do
            python3 tests/terminal_workflow_regressions.py --binary ".verification-macos-$mode/bin/omagma" --build-mode "$mode" --output "tests/results/workflows-macos-$mode.json"
          done
      - name: Native credential upgrade boundary
        run: |
          zig build -Doptimize=safe -Dstrip=true -j2 --prefix .verification-macos-upgrade
          python3 tests/keyring_macos.py --binary .verification-macos-safe/bin/omagma --upgrade-binary .verification-macos-upgrade/bin/omagma
          python3 tests/keyring_macos.py --binary .verification-macos-safe/bin/omagma --upgrade-binary .verification-macos-upgrade/bin/omagma --homebrew-resign
      - name: Ephemeral CI production default-Keychain dispatch
        run: |
          set -e
          for mode in safe; do
            python3 tests/keyring_default_macos.py --ephemeral-default --build-mode "$mode"
          done
      - name: Safe native unit correctness and retained-history stress
        run: |
          zig build test -Doptimize=safe -j2 --summary all --test-timeout 120s -Dtest-watchdog=true
          zig build test-native-history-stress -Doptimize=safe -j2 --summary all --test-timeout 1200s -Dtest-watchdog=true
      - name: Native Safe lifecycle and quiet gates
        run: |
          set -e
          for kind in cli tui; do
            python3 tests/terminal_measure_macos.py --binary .verification-macos-safe/bin/omagma --kind "$kind" --cycles 1000 --warmup 100 --idle-seconds 60 --output "tests/results/macos-$kind-safe.json"
          done
      - name: Preserve synthetic workflow receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflows-${{ matrix.runner }}
          path: |
            tests/results/workflows-*.json
            tests/results/macos-cli-safe.json
            tests/results/macos-tui-safe.json
          if-no-files-found: warn
          retention-days: 30
