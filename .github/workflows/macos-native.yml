name: Native macOS vault-launch diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omagma-vault-launch-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Focused native Mac ARM vault-launch diagnosis
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install exact declared native compiler
        run: python3 .github/install_zig.py
      - name: Verify native host and SDK
        run: |
          test "$(uname -m)" = arm64
          test "$(zig version)" = 0.17.0
          task_sdk=$(/usr/bin/xcrun --sdk macosx --show-sdk-path)
          test -d "$task_sdk/System/Library/Frameworks/Security.framework"
          test -d "$task_sdk/System/Library/Frameworks/CoreFoundation.framework"
          echo "SDKROOT=$task_sdk" >> "$GITHUB_ENV"
      - name: Focused unchanged and phase-marked readiness controls
        run: python3 tests/vault_launch_diagnostic.py
      - name: Preserve synthetic phase, watchdog and native stack evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault-launch-macos-arm64-diagnostic
          path: tests/results/vault-launch-diagnostic/
          if-no-files-found: error
          retention-days: 14
