name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualify_existing_version:
        description: Run read-only qualification even when this version is already published
        type: boolean
        default: false

permissions:
  contents: read

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.ci-zig/global

concurrency:
  group: omagma-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version || steps.branch.outputs.version }}
      needed: ${{ steps.version.outputs.needed || steps.branch.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Qualification and manual promotion policy checks
        run: python3 tests/qualification.py
      - name: Select the source-check Node toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Source, fixture and publication checks
        run: |
          python3 tests/zig_test_guard_check.py
          python3 tests/correctness_inventory.py
          python3 tests/ci_toolchain.py
          python3 tests/ci_cache_key.py
          python3 tests/terminal_editor_readiness.py
          python3 tests/release_binary.py
          python3 tests/publication_privacy.py
          python3 tests/release_notes.py
          python3 tests/terminal_compose_screen.py
          node tests/ui_model.mjs
          python3 tests/terminal_fixture_check.py
          python3 tests/terminal_screen.py
          python3 tests/terminal_ux_focus.py
          python3 tests/terminal_cache_fixture_check.py
          python3 tests/terminal_status_screen.py
          python3 tests/terminal_theme_screen.py
          python3 tests/terminal_reader.py
          python3 tests/terminal_html_screen.py
          python3 tests/terminal_html_fixture_check.py
          python3 tests/terminal_repaint_screen.py
          python3 tests/terminal_mouse_screen.py
          python3 tests/publication_gif.py
          python3 tests/homebrew_formula.py
      - name: Check package version
        if: github.ref == 'refs/heads/main'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFY_EXISTING_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_existing_version }}
        run: |
          if [ "$QUALIFY_EXISTING_VERSION" = true ]; then
            python3 scripts/publish_release.py --check --qualify-existing-version
          else
            python3 scripts/publish_release.py --check
          fi
      - name: Verify a development branch without publishing
        if: github.ref != 'refs/heads/main'
        id: branch
        run: |
          python3 - <<'PY'
          import os, subprocess
          version = subprocess.check_output(['python3', 'scripts/release.py', '--print-version'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nneeded=true\n')
          PY

  build:
    name: Linux ${{ matrix.arch }} qualification
    needs: version
    if: needs.version.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            zig_arch: x86_64
            target: x86_64-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            zig_arch: aarch64
            target: aarch64-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify compiler, dependencies and SDK cache inputs
        id: cache-inputs
        run: python3 .github/ci_cache_key.py
      - name: Restore verified compiler archive
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.tool_cache }}/omagma-zig
          key: zig-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/zig-release.json') }}
      - name: Restore shared content-addressed compiler cache
        id: zig-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .ci-zig/global
          key: zig-global-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}-tests
          restore-keys: |
            zig-global-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}-preflight
      - name: Restore app and probe compilation by build inputs
        id: preflight-build-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .zig-cache
          key: zig-preflight-app-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}-${{ steps.cache-inputs.outputs.app_key }}
      - name: Install the declared Zig compiler
        run: python3 .github/install_zig.py
      - name: Select the browser packaging toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
          package-manager-cache: false
      - name: Install pinned browser build dependencies and check host adapters
        run: |
          npm ci --prefix web-demo --ignore-scripts --no-audit --no-fund
          npm test --prefix web-demo
      - name: Ensure the timezone fixture database is available
        run: |
          if [ ! -f /usr/share/zoneinfo/Europe/Vienna ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y tzdata
          fi
          test -f /etc/localtime
          test -f /usr/share/zoneinfo/Europe/Vienna
          test -f /usr/share/zoneinfo/Asia/Kathmandu
      - name: Safe standalone probe preflight
        run: |
          zig version
          zig fmt --check build.zig src
          zig test src/native_history_stress_tests.zig -Osafe -target ${{ matrix.target }} -mcpu=baseline --test-filter "native history selector:"
          python3 tests/zig_test_guard_check.py --zig "$(command -v zig)"
          zig build probes -Doptimize=safe -Dtarget=${{ matrix.target }} -Dcpu=baseline -j2 --summary all --prefix .verification-safe -Dtest-watchdog=true
          .verification-safe/bin/auth_probe launch
          .verification-safe/bin/auth_probe callback
          .verification-safe/bin/callback_budget
          .verification-safe/bin/transport_probe
          python3 tests/terminal_attachment_streams.py --probe .verification-safe/bin/terminal_stream_probe
          python3 tests/calendar_native_http.py --probe .verification-safe/bin/calendar_http_probe
      - name: Build static release bundle
        run: python3 scripts/release.py --arch ${{ matrix.arch }}
      - name: Validate archive and executable
        run: python3 tests/release_check.py --arch ${{ matrix.arch }}
      - name: Exclude temporary data from preflight build cache
        run: python3 -c "import shutil; shutil.rmtree('.zig-cache/tmp', ignore_errors=True)"
      - name: Save completed app and probe compilation before functional tests
        if: steps.preflight-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .zig-cache
          key: ${{ steps.preflight-build-cache.outputs.cache-primary-key }}
      - name: Safe account and lifecycle checks
        run: python3 tests/integration.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/zig017-safe-integration.json
      - name: Safe transport checks
        run: |
          python3 tests/probes/transport_check.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --https --output tests/results/zig017-safe-transport.json
          dist/omagma-linux-${{ matrix.arch }} probe-callback
      - name: Isolated synthetic Secret Service check
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsecret-tools gnome-keyring dbus libglib2.0-bin
          dbus-run-session -- bash -euc '
            task_keyring_root=$(mktemp -d)
            export XDG_CONFIG_HOME="$task_keyring_root/config" XDG_DATA_HOME="$task_keyring_root/data" XDG_RUNTIME_DIR="$task_keyring_root/run"
            mkdir -m 700 "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
            unset GNOME_KEYRING_CONTROL
            printf "synthetic-ci-password\n" | gnome-keyring-daemon --foreground --unlock --components=secrets >/dev/null &
            task_keyring_pid=$!
            trap '\''kill "$task_keyring_pid" 2>/dev/null || true; wait "$task_keyring_pid" 2>/dev/null || true; rm -rf "$task_keyring_root"'\'' EXIT
            task_keyring_ready=false
            for attempt in {1..50}; do
              kill -0 "$task_keyring_pid"
              if gdbus call --session --dest org.freedesktop.DBus --object-path /org/freedesktop/DBus --method org.freedesktop.DBus.NameHasOwner org.freedesktop.secrets | grep -q true; then
                task_keyring_ready=true
                break
              fi
              sleep 0.1
            done
            test "$task_keyring_ready" = true
            dist/omagma-linux-$RELEASE_ARCH probe-keyring
            .verification-safe/bin/auth_probe keyring
          '
      - name: Verify the packaged browser server and synthetic browser workflows
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          node web-demo/build.mjs --wasm ".verification-release-$RELEASE_ARCH/web-demo/omagma.wasm" --out-dir .verification-browser-site
          task_browser_checks=none
          task_chromium_args=()
          if [ "$RELEASE_ARCH" = x86_64 ]; then
            task_browser_checks=both
            task_chromium_args=(--chromium "$(command -v google-chrome)")
          fi
          node tests/browser_server.mjs --binary "dist/omagma-linux-$RELEASE_ARCH" --site-dir .verification-browser-site --work-dir tests/results/browser-safe-server --browser-checks "$task_browser_checks" "${task_chromium_args[@]}"
      - name: Safe current terminal and agent feature acceptance
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          dist/omagma-linux-$RELEASE_ARCH build-info
          sha256sum dist/omagma-linux-$RELEASE_ARCH
          python3 tests/terminal_exit_refresh.py --binary dist/omagma-linux-$RELEASE_ARCH --build-mode safe --output tests/results/terminal-safe-exit-refresh.json
          for suite in \
            terminal_wishlist_backend terminal_cache_windows terminal_arrivals \
            terminal_composer_workflow terminal_compose_attachments \
            terminal_triage_ui terminal_reader_context \
            terminal_scroll_progress terminal_loading terminal_fetch_wheel \
            terminal_local_ui terminal_polish_reader terminal_polish_compose \
            terminal_polish_status terminal_timezone terminal_recipient_preview \
            terminal_editor_notice terminal_reader_copy terminal_reader_editor \
            terminal_file_dialog terminal_invitations terminal_cli_parity \
            terminal_cli_usage terminal_forward_ux \
            terminal_markdown_mail terminal_markdown_compose \
            terminal_label_management terminal_label_transport terminal_label_manager \
            terminal_help_search terminal_dialog_controls terminal_theme_picker \
            terminal_forward_original terminal_invitation_banner \
            terminal_ux_backend_cli terminal_queue_send_now credential_storage terminal_ux_batch_navigation \
            terminal_ux_batch_compose terminal_ux_batch_files_contacts \
            terminal_ux_helpers_ui terminal_ux_adversarial updates terminal_updates
          do
            python3 "tests/$suite.py" --binary "dist/omagma-linux-$RELEASE_ARCH"
          done
      - name: Safe Linux retained draft and compose acceptance
        run: |
          python3 tests/terminal_compose_actions.py --binary dist/omagma-linux-${{ matrix.arch }}
          python3 tests/terminal_draft_conflict.py --binary dist/omagma-linux-${{ matrix.arch }}
          python3 tests/terminal_draft_paging.py --binary dist/omagma-linux-${{ matrix.arch }}
          python3 tests/terminal_quote_policy.py --binary dist/omagma-linux-${{ matrix.arch }}
          python3 tests/terminal_reply_boundaries.py --binary dist/omagma-linux-${{ matrix.arch }}
          python3 tests/terminal_settled_recovery.py --binary dist/omagma-linux-${{ matrix.arch }}
      - name: Safe packaged first-use mail, Calendar and vault workflows
        run: python3 tests/terminal_workflow_regressions.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/workflows-linux-safe.json
      - name: Safe packaged independent HTML preservation oracle
        if: matrix.arch == 'x86_64'
        run: python3 tests/terminal_html_compatibility.py --binary dist/omagma-linux-x86_64 --browser "$(command -v google-chrome)" --receipt tests/results/terminal-safe-html-compatibility.json
      - name: Safe short terminal workflows
        run: |
          python3 tests/terminal_cache.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-cache-safe.json
          python3 tests/terminal_ui.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-ui-safe.json
          python3 tests/terminal_cache_max.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-cache-max-safe.json
          python3 tests/terminal_background.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-background-safe.json
          python3 tests/terminal_integration.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-integration.json
          python3 tests/terminal_transport.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-transport.json
          python3 tests/terminal_pty.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-pty.json
          python3 tests/terminal_mail_acceptance.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --receipt tests/results/terminal-safe-mail-acceptance.json
          python3 tests/terminal_repaint.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-repaint.json
          python3 tests/terminal_mouse.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-mouse.json

      - name: Safe short HTML acceptance
        run: |
          python3 tests/terminal_html.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-html-preflight.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve synthetic verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-linux-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            tests/results/*.json
            tests/results/browser-safe-server/server-acceptance.json
            tests/results/browser-safe-server/demo-browser/browser-acceptance.json
            tests/results/browser-safe-server/demo-browser/rendering-acceptance.json
            tests/results/browser-safe-server/native-connect-browser/native-connect-acceptance.json
            tests/results/browser-safe-server/connect-browser/connect-acceptance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Exclude temporary test data from compilation caches
        if: always()
        run: |
          python3 - <<'PY'
          import shutil
          for path in ('.zig-cache/tmp', '.ci-zig/global/tmp'):
              shutil.rmtree(path, ignore_errors=True)
          PY
      - name: Save reusable compiler and dependency cache
        if: always() && steps.zig-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .ci-zig/global
          key: zig-global-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}-preflight


  macos-build:
    name: macOS ${{ matrix.arch }} qualification
    needs: version
    if: needs.version.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native architecture labels, rather than a moving macos-latest.
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - arch: arm64
            runner: macos-15
            machine: arm64
            target: aarch64-macos.13.0
            job_timeout: 90
          - arch: x86_64
            runner: macos-15-intel
            machine: x86_64
            target: x86_64-macos.13.0
            job_timeout: 90
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify compiler, dependencies and SDK cache inputs
        id: cache-inputs
        run: python3 .github/ci_cache_key.py
      - name: Restore verified compiler archive
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.tool_cache }}/omagma-zig
          key: zig-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/zig-release.json') }}
      - name: Restore shared content-addressed compiler cache
        id: zig-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .ci-zig/global
          key: zig-global-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}-tests
          restore-keys: |
            zig-global-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}-preflight
      - name: Restore app and probe compilation by build inputs
        id: preflight-build-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .zig-cache
          key: zig-preflight-app-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}-${{ steps.cache-inputs.outputs.app_key }}
      - name: Install the declared native Zig compiler
        run: python3 .github/install_zig.py
      - name: Select the browser packaging toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
          package-manager-cache: false
      - name: Install pinned browser build dependencies and check host adapters
        run: |
          npm ci --prefix web-demo --ignore-scripts --no-audit --no-fund
          npm test --prefix web-demo
      - name: Verify native host, SDK and timezone fixtures
        run: |
          test "$(uname -m)" = '${{ matrix.machine }}'
          task_sdk=$(/usr/bin/xcrun --show-sdk-path)
          test -d "$task_sdk/System/Library/Frameworks/Security.framework"
          test -d "$task_sdk/System/Library/Frameworks/CoreFoundation.framework"
          echo "SDKROOT=$task_sdk" >> "$GITHUB_ENV"
          test -f /etc/localtime
          test -f /usr/share/zoneinfo/Europe/Vienna
          test -f /usr/share/zoneinfo/Asia/Kathmandu
      - name: Safe standalone probe preflight
        run: |
          zig version
          zig fmt --check build.zig src
          zig test src/native_history_stress_tests.zig -Osafe -target ${{ matrix.target }} -mcpu=baseline --test-filter "native history selector:"
          python3 tests/zig_test_guard_check.py --zig "$(command -v zig)"
          zig build install probes -Doptimize=safe -Dtarget=${{ matrix.target }} -Dcpu=baseline -j2 --summary all --prefix .verification-macos-safe -Dtest-watchdog=true
          .verification-macos-safe/bin/auth_probe keyring
          .verification-macos-safe/bin/auth_probe launch
          .verification-macos-safe/bin/auth_probe callback
          .verification-macos-safe/bin/callback_budget
          python3 tests/terminal_attachment_streams.py --probe .verification-macos-safe/bin/terminal_stream_probe
          python3 tests/calendar_native_http.py --probe .verification-macos-safe/bin/calendar_http_probe
          python3 tests/keyring_default_macos.py --ephemeral-default --build-mode safe
      - name: Build stripped native macOS release bundle
        run: python3 scripts/release.py --os macos --arch ${{ matrix.arch }}
      - name: Validate macOS archive and native executable
        run: |
          python3 tests/release_check.py --os macos --arch ${{ matrix.arch }}
          file dist/omagma-macos-${{ matrix.arch }}
          /usr/bin/otool -L dist/omagma-macos-${{ matrix.arch }}
          /usr/bin/xcrun vtool -show-build dist/omagma-macos-${{ matrix.arch }}
          dist/omagma-macos-${{ matrix.arch }} build-info
      - name: Exclude temporary data from preflight build cache
        run: python3 -c "import shutil; shutil.rmtree('.zig-cache/tmp', ignore_errors=True)"
      - name: Save completed app and probe compilation before functional tests
        if: steps.preflight-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .zig-cache
          key: ${{ steps.preflight-build-cache.outputs.cache-primary-key }}
      - name: Verify the packaged macOS browser server
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          node web-demo/build.mjs --wasm ".verification-release-macos-$RELEASE_ARCH/web-demo/omagma.wasm" --out-dir .verification-browser-site
          node tests/browser_server.mjs --binary "dist/omagma-macos-$RELEASE_ARCH" --site-dir .verification-browser-site --work-dir tests/results/browser-safe-server
      - name: Safe packaged CLI, transport and native lifecycle
        run: |
          python3 tests/terminal_integration.py --binary dist/omagma-macos-${{ matrix.arch }} --build-mode safe --output tests/results/macos-safe-cli.json
          python3 tests/terminal_wishlist_backend.py --binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/terminal_cache_windows.py --binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/terminal_transport.py --binary dist/omagma-macos-${{ matrix.arch }} --build-mode safe --output tests/results/macos-safe-transport.json
          python3 tests/terminal_macos.py --binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/terminal_macos_features.py --binary dist/omagma-macos-${{ matrix.arch }} --build-mode safe --output tests/results/macos-safe-features.json
          python3 tests/terminal_mail_acceptance.py --binary dist/omagma-macos-${{ matrix.arch }} --build-mode safe --receipt tests/results/macos-safe-mail-acceptance.json
          python3 tests/terminal_ux_macos.py --binary dist/omagma-macos-${{ matrix.arch }} --build-mode safe --output tests/results/macos-safe-ux.json
          python3 tests/terminal_reader_copy.py --binary dist/omagma-macos-${{ matrix.arch }} --output tests/results/macos-safe-reader-copy.json
          python3 tests/terminal_reader_editor.py --binary dist/omagma-macos-${{ matrix.arch }} --build-mode safe --output tests/results/macos-safe-reader-editor.json
          python3 tests/launch_macos.py --binary dist/omagma-macos-${{ matrix.arch }}
          dist/omagma-macos-${{ matrix.arch }} probe-keyring
      - name: Safe portable Markdown, invitation and command acceptance
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          python3 tests/terminal_cli_usage.py --binary dist/omagma-macos-$RELEASE_ARCH --build-mode safe --receipt tests/results/macos-safe-usage.json
          python3 tests/terminal_cli_parity.py --binary dist/omagma-macos-$RELEASE_ARCH --build-mode safe --receipt tests/results/macos-safe-cli-parity.json
          python3 tests/terminal_markdown_mail.py --binary dist/omagma-macos-$RELEASE_ARCH --receipt tests/results/macos-safe-markdown.json
          python3 tests/terminal_forward_original.py --binary dist/omagma-macos-$RELEASE_ARCH --receipt tests/results/macos-safe-forward-original.json
          python3 tests/terminal_label_management.py --binary dist/omagma-macos-$RELEASE_ARCH
          python3 tests/terminal_label_transport.py --binary dist/omagma-macos-$RELEASE_ARCH
          python3 tests/terminal_ux_backend_cli.py --binary dist/omagma-macos-$RELEASE_ARCH
          python3 tests/terminal_queue_send_now.py --binary dist/omagma-macos-$RELEASE_ARCH
          python3 tests/credential_storage.py --binary dist/omagma-macos-$RELEASE_ARCH
          python3 tests/updates.py --binary dist/omagma-macos-$RELEASE_ARCH
      - name: Safe macOS retained draft and compose acceptance
        run: |
          python3 tests/terminal_compose_actions.py --binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/terminal_draft_conflict.py --binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/terminal_draft_paging.py --binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/terminal_quote_policy.py --binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/terminal_reply_boundaries.py --binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/terminal_settled_recovery.py --binary dist/omagma-macos-${{ matrix.arch }}
      - name: Safe packaged first-use mail, Calendar and vault workflows
        run: python3 tests/terminal_workflow_regressions.py --binary dist/omagma-macos-${{ matrix.arch }} --build-mode safe --output tests/results/workflows-macos-safe.json
      - name: Native Keychain survives the packaged binary upgrade
        run: |
          python3 tests/keyring_macos.py --binary .verification-macos-safe/bin/omagma --upgrade-binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/keyring_macos.py --binary .verification-macos-safe/bin/omagma --upgrade-binary dist/omagma-macos-${{ matrix.arch }} --homebrew-resign
      - name: Native credential-free HTTPS with system CA certificates
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, signal, subprocess
          from pathlib import Path
          checks = []
          for mode, binary in [('safe', Path('dist/omagma-macos-' + os.environ['RELEASE_ARCH']))]:
              info = json.loads(subprocess.check_output([str(binary.resolve()), 'build-info'], text=True, timeout=10))
              assert info['zigVersion'] == '0.17.0' and info['optimizeMode'] == mode, info
              child = subprocess.Popen([str(binary.resolve()), 'probe-https'], stdin=subprocess.DEVNULL,
                                       stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
              try:
                  out, err = child.communicate(timeout=45)
              except subprocess.TimeoutExpired:
                  os.killpg(child.pid, signal.SIGKILL)
                  child.communicate()
                  raise
              assert child.returncode == 0 and not err, 'HTTPS probe failed or emitted diagnostics'
              assert len(out.splitlines()) == 1, 'HTTPS probe did not emit one bounded frame'
              frame = json.loads(out)
              assert frame['ok'] and frame['status'] == 401, frame
              assert 0 <= frame['bodyBytes'] <= 524288 and 0 <= frame['httpPeakBytes'] <= 8 * 1024 * 1024, frame
              checks.append({'buildInfo': info, 'binarySha256': hashlib.sha256(binary.read_bytes()).hexdigest(), **frame})
          Path('tests/results').mkdir(parents=True, exist_ok=True)
          Path('tests/results/macos-credential-free-https.json').write_text(json.dumps({'passed': True, 'credentialsUsed': False, 'checks': checks}, indent=2) + '\n')
          print('PASS packaged Safe HTTPS: credential-free401 and bounded storage')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: release-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve synthetic macOS verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-macos-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            tests/results/*.json
            tests/results/browser-safe-server/server-acceptance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Exclude temporary test data from compilation caches
        if: always()
        run: |
          python3 - <<'PY'
          import shutil
          for path in ('.zig-cache/tmp', '.ci-zig/global/tmp'):
              shutil.rmtree(path, ignore_errors=True)
          PY
      - name: Save reusable compiler and dependency cache
        if: always() && steps.zig-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .ci-zig/global
          key: zig-global-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.key }}-preflight


  compile:
    name: Compile ${{ matrix.platform }}
    needs: [version, build, macos-build]
    if: needs.version.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-arm64, macos-arm64, macos-x86_64]
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-linux-musl
            os: linux
            arch: x86_64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
            os: linux
            arch: arm64
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-macos.13.0
            os: macos
            arch: arm64
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-macos.13.0
            os: macos
            arch: x86_64
    uses: ./.github/workflows/native-gate.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      gate: compile

  gates:
    name: Gate ${{ matrix.platform }} ${{ matrix.gate }}
    needs: [version, build, macos-build, compile]
    if: needs.version.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        gate: [history-files-plain, history-files-vault, history-sends-plain, history-sends-vault, history-calendar, send, unit-main, unit-extra, unit-memory, adapters, resources]
        platform: [linux-x86_64, linux-arm64, macos-arm64, macos-x86_64]
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-linux-musl
            os: linux
            arch: x86_64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
            os: linux
            arch: arm64
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-macos.13.0
            os: macos
            arch: arm64
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-macos.13.0
            os: macos
            arch: x86_64
    uses: ./.github/workflows/native-gate.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      gate: ${{ matrix.gate }}

  qualified:
    name: Ready for approval
    needs: [version, build, macos-build, compile, gates]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Record the verified candidate
        env:
          QUALIFIED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          repo, run, commit = (os.environ[name] for name in ('GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_SHA'))
          version = os.environ['QUALIFIED_VERSION']
          summary = f"## Candidate {version} qualified\n\nAll four native preflights and all 44 independent Safe gates passed. No release has been published.\n\nCommit: `{commit}`\n\nQualification run: [{run}](https://github.com/{repo}/actions/runs/{run})\n\nAfter explicit approval, run **Publish qualified release** with this run ID. The verified artifacts are retained for 30 days; a changed revision needs fresh qualification.\n"
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)
          PY
