name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omagma-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version || steps.branch.outputs.version }}
      needed: ${{ steps.version.outputs.needed || steps.branch.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check package version
        if: github.ref == 'refs/heads/main'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py --check
      - name: Verify a development branch without publishing
        if: github.ref != 'refs/heads/main'
        id: branch
        run: |
          python3 - <<'PY'
          import os, subprocess
          version = subprocess.check_output(['python3', 'scripts/release.py', '--print-version'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nneeded=true\n')
          PY

  build:
    needs: version
    if: needs.version.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            zig_arch: x86_64
            target: x86_64-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            zig_arch: aarch64
            target: aarch64-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the declared Zig compiler
        run: python3 .github/install_zig.py
      - name: Release format and architecture oracles
        run: python3 tests/release_binary.py
      - name: Ensure the timezone fixture database is available
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tzdata
          test -f /etc/localtime
          test -f /usr/share/zoneinfo/Europe/Vienna
          test -f /usr/share/zoneinfo/Asia/Kathmandu
      - name: Debug correctness checks
        run: |
          zig version
          zig build test probes -Doptimize=debug -Dtarget=${{ matrix.target }} -Dcpu=baseline -j2 --summary all --prefix .verification-debug
          zig build -Doptimize=debug -Dtarget=${{ matrix.target }} -Dcpu=baseline -j2 --prefix .verification-debug
          python3 tests/integration.py --binary .verification-debug/bin/omagma --build-mode debug --output tests/results/zig017-debug-integration.json
          python3 tests/probes/transport_check.py --binary .verification-debug/bin/omagma --build-mode debug --https --output tests/results/zig017-debug-transport.json
          .verification-debug/bin/auth_probe launch
          .verification-debug/bin/auth_probe callback
          .verification-debug/bin/callback_budget
          .verification-debug/bin/transport_probe
          node tests/ui_model.mjs
          python3 tests/terminal_fixture_check.py
          python3 tests/terminal_screen.py
          python3 tests/terminal_cache_fixture_check.py
          python3 tests/terminal_status_screen.py
          python3 tests/terminal_reader.py
          python3 tests/terminal_html_screen.py
          python3 tests/terminal_html_fixture_check.py
          python3 tests/terminal_repaint_screen.py
          python3 tests/terminal_mouse_screen.py
          python3 tests/terminal_cache.py --binary .verification-debug/bin/omagma --build-mode debug --output tests/results/terminal-cache-debug.json
          python3 tests/terminal_ui.py --binary .verification-debug/bin/omagma --build-mode debug --output tests/results/terminal-ui-debug.json
          python3 tests/terminal_cache_max.py --binary .verification-debug/bin/omagma --build-mode debug --output tests/results/terminal-cache-max-debug.json
          python3 tests/terminal_background.py --binary .verification-debug/bin/omagma --build-mode debug --output tests/results/terminal-background-debug.json
          python3 tests/terminal_integration.py --binary .verification-debug/bin/omagma --build-mode debug --output tests/results/terminal-debug-integration.json
          python3 tests/terminal_transport.py --binary .verification-debug/bin/omagma --build-mode debug --output tests/results/terminal-debug-transport.json
          python3 tests/terminal_pty.py --binary .verification-debug/bin/omagma --build-mode debug --output tests/results/terminal-debug-pty.json
          python3 tests/terminal_html.py --binary .verification-debug/bin/omagma --build-mode debug --output tests/results/terminal-debug-html.json
          python3 tests/terminal_repaint.py --binary .verification-debug/bin/omagma --build-mode debug --output tests/results/terminal-debug-repaint.json
          python3 tests/terminal_mouse.py --binary .verification-debug/bin/omagma --build-mode debug --output tests/results/terminal-debug-mouse.json
      - name: Debug current terminal and agent feature acceptance
        run: |
          .verification-debug/bin/omagma build-info
          sha256sum .verification-debug/bin/omagma
          python3 tests/publication_gif.py
          python3 tests/homebrew_formula.py
          for suite in \
            terminal_wishlist_backend terminal_cache_windows \
            terminal_composer_workflow terminal_compose_attachments \
            terminal_triage_ui terminal_reader_context \
            terminal_scroll_progress terminal_loading terminal_fetch_wheel \
            terminal_local_ui terminal_polish_reader terminal_polish_compose \
            terminal_polish_status terminal_timezone terminal_recipient_preview \
            terminal_editor_notice
          do
            python3 "tests/$suite.py" --binary .verification-debug/bin/omagma
          done
      - name: Safe correctness and standalone probes
        run: |
          zig build test probes -Doptimize=safe -Dtarget=${{ matrix.target }} -Dcpu=baseline -j2 --summary all --prefix .verification-safe
          .verification-safe/bin/auth_probe launch
          .verification-safe/bin/auth_probe callback
          .verification-safe/bin/callback_budget
          .verification-safe/bin/transport_probe
      - name: Build static release bundle
        run: python3 scripts/release.py --arch ${{ matrix.arch }}
      - name: Validate archive and executable
        run: python3 tests/release_check.py --arch ${{ matrix.arch }}
      - name: Safe account and lifecycle checks
        run: python3 tests/integration.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/zig017-safe-integration.json
      - name: Safe transport checks
        run: |
          python3 tests/probes/transport_check.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --https --output tests/results/zig017-safe-transport.json
          dist/omagma-linux-${{ matrix.arch }} probe-callback
      - name: Isolated synthetic Secret Service check
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsecret-tools gnome-keyring dbus libglib2.0-bin
          dbus-run-session -- bash -euc '
            task_keyring_root=$(mktemp -d)
            export XDG_CONFIG_HOME="$task_keyring_root/config" XDG_DATA_HOME="$task_keyring_root/data" XDG_RUNTIME_DIR="$task_keyring_root/run"
            mkdir -m 700 "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
            unset GNOME_KEYRING_CONTROL
            printf "synthetic-ci-password\n" | gnome-keyring-daemon --foreground --unlock --components=secrets >/dev/null &
            task_keyring_pid=$!
            trap '\''kill "$task_keyring_pid" 2>/dev/null || true; wait "$task_keyring_pid" 2>/dev/null || true; rm -rf "$task_keyring_root"'\'' EXIT
            task_keyring_ready=false
            for attempt in {1..50}; do
              kill -0 "$task_keyring_pid"
              if gdbus call --session --dest org.freedesktop.DBus --object-path /org/freedesktop/DBus --method org.freedesktop.DBus.NameHasOwner org.freedesktop.secrets | grep -q true; then
                task_keyring_ready=true
                break
              fi
              sleep 0.1
            done
            test "$task_keyring_ready" = true
            dist/omagma-linux-$RELEASE_ARCH probe-keyring
            .verification-debug/bin/auth_probe keyring
            .verification-safe/bin/auth_probe keyring
          '
      - name: Safe current terminal and agent feature acceptance
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          dist/omagma-linux-$RELEASE_ARCH build-info
          sha256sum dist/omagma-linux-$RELEASE_ARCH
          for suite in \
            terminal_wishlist_backend terminal_cache_windows \
            terminal_composer_workflow terminal_compose_attachments \
            terminal_triage_ui terminal_reader_context \
            terminal_scroll_progress terminal_loading terminal_fetch_wheel \
            terminal_local_ui terminal_polish_reader terminal_polish_compose \
            terminal_polish_status terminal_timezone terminal_recipient_preview \
            terminal_editor_notice
          do
            python3 "tests/$suite.py" --binary "dist/omagma-linux-$RELEASE_ARCH"
          done
      - name: Safe terminal workflows and memory
        run: |
          python3 tests/terminal_cache.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-cache-safe.json
          python3 tests/terminal_ui.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-ui-safe.json
          python3 tests/terminal_cache_max.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-cache-max-safe.json
          python3 tests/terminal_background.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-background-safe.json
          python3 tests/terminal_integration.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-integration.json
          python3 tests/terminal_transport.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-transport.json
          python3 tests/terminal_pty.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-pty.json
          python3 tests/terminal_html.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-html.json --resource-cycles 1000 --idle-seconds 60
          python3 tests/terminal_repaint.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-repaint.json
          python3 tests/terminal_mouse.py --binary dist/omagma-linux-${{ matrix.arch }} --build-mode safe --output tests/results/terminal-safe-mouse.json
          python3 tests/terminal_measure.py --kind cli --binary dist/omagma-linux-${{ matrix.arch }} --output tests/results/terminal-safe-cli-memory.json
          python3 tests/terminal_measure.py --kind tui --binary dist/omagma-linux-${{ matrix.arch }} --output tests/results/terminal-safe-tui-memory.json
      - name: Safe memory gate
        run: python3 tests/measure.py --binary dist/omagma-linux-${{ matrix.arch }} --output tests/results/zig017-safe-memory.json
      - name: Safe background scheduling memory gate
        run: python3 tests/background_measure.py --fixtures --config tests/fixtures/all-accounts.json --binary dist/omagma-linux-${{ matrix.arch }} --output tests/results/zig017-safe-background.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Preserve synthetic verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-linux-${{ matrix.arch }}
          path: tests/results/*.json
          if-no-files-found: warn
          retention-days: 30

  macos-build:
    needs: version
    if: needs.version.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native architecture labels, rather than a moving macos-latest.
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - arch: arm64
            runner: macos-15
            machine: arm64
            target: aarch64-macos.13.0
          - arch: x86_64
            runner: macos-15-intel
            machine: x86_64
            target: x86_64-macos.13.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the declared native Zig compiler
        run: python3 .github/install_zig.py
      - name: Release format and architecture oracles
        run: python3 tests/release_binary.py
      - name: Verify native host, SDK and timezone fixtures
        run: |
          test "$(uname -m)" = '${{ matrix.machine }}'
          task_sdk=$(/usr/bin/xcrun --show-sdk-path)
          test -d "$task_sdk/System/Library/Frameworks/Security.framework"
          test -d "$task_sdk/System/Library/Frameworks/CoreFoundation.framework"
          echo "SDKROOT=$task_sdk" >> "$GITHUB_ENV"
          test -f /etc/localtime
          test -f /usr/share/zoneinfo/Europe/Vienna
          test -f /usr/share/zoneinfo/Asia/Kathmandu
      - name: Debug native correctness and synthetic fixtures
        run: |
          zig version
          zig build test probes -Doptimize=debug -Dtarget=${{ matrix.target }} -Dcpu=baseline -j2 --summary all --prefix .verification-macos-debug
          zig build -Doptimize=debug -Dtarget=${{ matrix.target }} -Dcpu=baseline -j2 --prefix .verification-macos-debug
          .verification-macos-debug/bin/omagma build-info
          shasum -a 256 .verification-macos-debug/bin/omagma
          python3 tests/terminal_fixture_check.py
          python3 tests/terminal_cache_fixture_check.py
          python3 tests/terminal_screen.py
          python3 tests/terminal_status_screen.py
          python3 tests/terminal_reader.py
          python3 tests/terminal_html_screen.py
          python3 tests/terminal_html_fixture_check.py
          python3 tests/terminal_repaint_screen.py
          python3 tests/terminal_mouse_screen.py
          python3 tests/publication_gif.py
          python3 tests/homebrew_formula.py
          python3 tests/terminal_integration.py --binary .verification-macos-debug/bin/omagma --build-mode debug --output tests/results/macos-debug-cli.json
          python3 tests/terminal_wishlist_backend.py --binary .verification-macos-debug/bin/omagma
          python3 tests/terminal_cache_windows.py --binary .verification-macos-debug/bin/omagma
          python3 tests/terminal_transport.py --binary .verification-macos-debug/bin/omagma --build-mode debug --output tests/results/macos-debug-transport.json
      - name: Debug native terminal, Keychain and detached lifecycle
        run: |
          # This guardian keeps the owned Darwin PTY alive for termios checks.
          # Linux /proc resource and stock session-leader PTY harnesses stay in
          # the Linux job; these checks do not establish a macOS memory baseline.
          python3 tests/terminal_macos.py --binary .verification-macos-debug/bin/omagma
          python3 tests/launch_macos.py --binary .verification-macos-debug/bin/omagma
          .verification-macos-debug/bin/omagma probe-keyring
          .verification-macos-debug/bin/auth_probe keyring
          .verification-macos-debug/bin/auth_probe launch
          .verification-macos-debug/bin/auth_probe callback
          .verification-macos-debug/bin/callback_budget
          python3 tests/keyring_default_macos.py --ephemeral-default --build-mode debug
      - name: Safe native correctness and standalone probes
        run: |
          zig build test probes -Doptimize=safe -Dtarget=${{ matrix.target }} -Dcpu=baseline -j2 --summary all --prefix .verification-macos-safe
          .verification-macos-safe/bin/auth_probe keyring
          .verification-macos-safe/bin/auth_probe launch
          .verification-macos-safe/bin/auth_probe callback
          .verification-macos-safe/bin/callback_budget
          python3 tests/keyring_default_macos.py --ephemeral-default --build-mode safe
      - name: Build stripped native macOS release bundle
        run: python3 scripts/release.py --os macos --arch ${{ matrix.arch }}
      - name: Validate macOS archive and native executable
        run: |
          python3 tests/release_check.py --os macos --arch ${{ matrix.arch }}
          file dist/omagma-macos-${{ matrix.arch }}
          /usr/bin/otool -L dist/omagma-macos-${{ matrix.arch }}
          /usr/bin/xcrun vtool -show-build dist/omagma-macos-${{ matrix.arch }}
          dist/omagma-macos-${{ matrix.arch }} build-info
      - name: Safe packaged CLI, transport and native lifecycle
        run: |
          python3 tests/terminal_integration.py --binary dist/omagma-macos-${{ matrix.arch }} --build-mode safe --output tests/results/macos-safe-cli.json
          python3 tests/terminal_wishlist_backend.py --binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/terminal_cache_windows.py --binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/terminal_transport.py --binary dist/omagma-macos-${{ matrix.arch }} --build-mode safe --output tests/results/macos-safe-transport.json
          python3 tests/terminal_macos.py --binary dist/omagma-macos-${{ matrix.arch }}
          python3 tests/launch_macos.py --binary dist/omagma-macos-${{ matrix.arch }}
          dist/omagma-macos-${{ matrix.arch }} probe-keyring
      - name: Native Keychain survives the packaged binary upgrade
        run: python3 tests/keyring_macos.py --binary .verification-macos-debug/bin/omagma --upgrade-binary dist/omagma-macos-${{ matrix.arch }}
      - name: Native macOS memory and quiet CPU gates
        run: |
          python3 tests/terminal_measure_macos.py --binary dist/omagma-macos-${{ matrix.arch }} --kind cli --cycles 1000 --warmup 100 --idle-seconds 60 --output tests/results/macos-safe-cli-memory.json
          python3 tests/terminal_measure_macos.py --binary dist/omagma-macos-${{ matrix.arch }} --kind tui --cycles 1000 --warmup 100 --idle-seconds 60 --output tests/results/macos-safe-tui-memory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Preserve synthetic macOS verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-macos-${{ matrix.arch }}
          path: tests/results/*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [version, build, macos-build]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Combine and verify checksums
        working-directory: dist
        run: |
          cat SHA256SUMS-x86_64 SHA256SUMS-arm64 SHA256SUMS-macos-x86_64 SHA256SUMS-macos-arm64 > SHA256SUMS
          sha256sum LICENSES.txt >> SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish new version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/publish_release.py

  homebrew:
    needs: [version, publish]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.needed == 'true'
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
