name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - assets/**
      - skills/**
      - LICENSES/**
      - README.md
      - AGENTS.md
      - EVIDENCE.md
      - build.zig.zon
      - LICENSE
      - tests/publication_check.py
      - tests/publication_gif.py
      - .github/workflows/pages.yml
      - .github/pages_release_ready.py
  pull_request:
    paths:
      - website/**
      - docs/**
      - assets/**
      - skills/**
      - LICENSES/**
      - README.md
      - AGENTS.md
      - EVIDENCE.md
      - build.zig.zon
      - LICENSE
      - tests/publication_check.py
      - tests/publication_gif.py
      - .github/workflows/pages.yml
      - .github/pages_release_ready.py
  workflow_dispatch:
  workflow_run:
    workflows: [Publish qualified release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: omagma-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select the website toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: website/package-lock.json
          package-manager-cache: false
      - name: Read configured Pages metadata
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Audit the public source tree
        run: |
          python3 tests/publication_gif.py
          python3 tests/publication_check.py
      - name: Install the locked website dependency
        run: npm ci --prefix website --ignore-scripts --no-audit --no-fund
      - name: Build static documentation
        env:
          # An empty configured base_path means a root/custom-domain site.
          # PRs and branch checks use the public project's expected base.
          OMAGMA_SITE_BASE: ${{ github.ref == 'refs/heads/main' && format('{0}/', steps.pages.outputs.base_path) || '/omagma/' }}
          OMAGMA_SITE_URL: ${{ steps.pages.outputs.base_url || 'https://technologylab-ai.github.io/omagma/' }}
        run: npm run build --prefix website
      - name: Check artifact links, files and privacy
        run: npm run check --prefix website
      - name: Upload only the generated site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist
          retention-days: 1

  publication:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Keep installation guides paired with available release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/pages_release_ready.py

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.publication.outputs.ready == 'true'
    needs: [build, publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy audited artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
